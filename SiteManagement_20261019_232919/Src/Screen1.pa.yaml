                      Properties:
                        DisabledBorderColor: =ColorValue("#E6E6E6")
                        PressedBorderColor: =ColorValue("#18DD6E")
                        HoverBorderColor: =ColorValue("#18DD6E")
                        BorderColor: =ColorValue("#1AFF80")
                        BorderThickness: =0
                        Color: =ColorValue("#000F41")
                        DisabledColor: =ColorValue("#787878")
                        DisabledFill: =ColorValue("#E6E6E6")
                        DisplayMode: |-
                          =If(And(varTeamLoadState="Loaded",
                          Coalesce(varSelectionLoaded,false),
                          Coalesce(varSelectionKeysValid,false),
                          !Coalesce(varSelectionBusy,false),
                          !Coalesce(varSaving,false),
                          IsEmpty(colSelectionLoadErrors),
                          !IsBlank(ddProject.Selected.Id),
                          !IsBlank(ddTeam.Selected.Value),
                          varTeamLoadedProjectID=ddProject.Selected.Id,
                          varTeamLoadedTeam=ddTeam.Selected.Value,
                          CountRows(colCurrentTeamAssignments)=varTeamLoadedAssignmentCount,
                          CountRows(colTeamOriginalSelection)=varTeamLoadedAssignmentCount,
                          CountIf(colCurrentTeamAssignments,Project.Id<>varTeamLoadedProjectID || Team.Value<>varTeamLoadedTeam || Active<>true)=0,
                          !IsEmpty(colSelectedWorkers),
                          CountIf(colSelectedWorkers,IsBlank(ID))=0,
                          CountRows(Distinct(colSelectedWorkers,ID))=CountRows(colSelectedWorkers),
                          CountIf(colTeamOriginalSelection,!(ID in ShowColumns(colSelectedWorkers,ID)) && !(ID in ShowColumns(colTeamRemovedIDs,WorkerID)))=0),DisplayMode.Edit,DisplayMode.Disabled)
                        Fill: =ColorValue("#1AFF80")
                        Font: ="Inter, Arial, sans-serif"
                        HoverColor: =ColorValue("#000F41")
                        HoverFill: =ColorValue("#18DD6E")
                        OnSelect: |-
                          =If(And(varTeamLoadState="Loaded",
                          Coalesce(varSelectionLoaded,false),
                          Coalesce(varSelectionKeysValid,false),
                          !Coalesce(varSelectionBusy,false),
                          !Coalesce(varSaving,false),
                          IsEmpty(colSelectionLoadErrors),
                          !IsBlank(ddProject.Selected.Id),
                          !IsBlank(ddTeam.Selected.Value),
                          varTeamLoadedProjectID=ddProject.Selected.Id,
                          varTeamLoadedTeam=ddTeam.Selected.Value,
                          CountRows(colCurrentTeamAssignments)=varTeamLoadedAssignmentCount,
                          CountRows(colTeamOriginalSelection)=varTeamLoadedAssignmentCount,
                          CountIf(colCurrentTeamAssignments,Project.Id<>varTeamLoadedProjectID || Team.Value<>varTeamLoadedTeam || Active<>true)=0,
                          !IsEmpty(colSelectedWorkers),
                          CountIf(colSelectedWorkers,IsBlank(ID))=0,
                          CountRows(Distinct(colSelectedWorkers,ID))=CountRows(colSelectedWorkers),
                          CountIf(colTeamOriginalSelection,!(ID in ShowColumns(colSelectedWorkers,ID)) && !(ID in ShowColumns(colTeamRemovedIDs,WorkerID)))=0),
                          If(
                              IsBlank(ddProject.Selected.Id) ||
                              IsBlank(ddTeam.Selected.Value),
                              Notify(
                                  "Selecteer eerst een project en team.",
                                  NotificationType.Warning
                              ),
                          
                              Set(varReportReady,false); Set(varReportValid,false); Set(varSaving, true);
                              Clear(colAssignmentErrors);
                              ClearCollect(
                                  colTeamSelectionToSave,
                                  colSelectedWorkers
                              );
                              ClearCollect(
                                  colTeamAssignmentsToCheck,
                                  colCurrentTeamAssignments
                              );
                              Clear(colTeamSaveCheck); Clear(colTeamToDeactivate); Clear(colTeamPatched); Clear(colTeamDeactivated);
                          
                              IfError(
                                  With(
                                      {
                                          chosenProject: ddProject.Selected,
                                          chosenTeam: ddTeam.Selected,
                                          projectKeyValue: Text(ddProject.Selected.Id)
                                      },
                          
                                      Set(varTeamSaveProjectKey,Text(varTeamLoadedProjectID));
                                      IfError(Refresh('Project Workers'),Collect(colAssignmentErrors,{WorkerID:0,Message:FirstError.Message});false);
                                      If(IsEmpty(colAssignmentErrors),
                                          IfError(CountRows(ClearCollect(colTeamSaveCheck,Filter('Project Workers',ProjectKey=varTeamSaveProjectKey)))>=0,
                                              Collect(colAssignmentErrors,{WorkerID:0,Message:FirstError.Message});false)
                                      );
                                      If(CountRows(colTeamSaveCheck)>=500,
                                          Collect(colAssignmentErrors,{WorkerID:0,Message:"500 koppelingen voor dit project gelezen; volledigheid niet gegarandeerd. Opslaan gestopt."})
                                      );
                                      If(CountIf(colTeamSaveCheck,Project.Id<>varTeamLoadedProjectID)>0,
                                          Collect(colAssignmentErrors,{WorkerID:0,Message:"Een koppeling met de projectsleutel van dit project verwijst naar een ander project. Gegevens laten controleren; opslaan geblokkeerd."})
                                      );
                          
                                      If(IsEmpty(colAssignmentErrors),
                                          ForAll(
                                              colTeamSelectionToSave As person,
                                              If(
                                                  CountIf(colTeamSaveCheck,AssignmentKey = varTeamSaveProjectKey & "|" & Text(person.ID)) > 1,
                                                  Collect(colAssignmentErrors,{WorkerID:person.ID,Message:"Dubbele koppelingen voor deze medewerker in dit project. Opslaan gestopt; bestaande koppelingen laten controleren."})
                                              )
                                          );
                          
                                          ForAll(
                                              Filter(
                                                  colTeamAssignmentsToCheck As assignment,
                                                  !(assignment.Worker.Id in colTeamSelectionToSave.ID) && assignment.Worker.Id in ShowColumns(colTeamRemovedIDs,WorkerID)
                                              ) As removedAssignment,
                                              With(
                                                  {
                                                      currentAssignment: LookUp(colTeamSaveCheck As stored, stored.ID = removedAssignment.ID)
                                                  },
                                                  If(
                                                      IsBlank(currentAssignment.ID),
                                                      Collect(colAssignmentErrors,{WorkerID:removedAssignment.Worker.Id,Message:"Een bestaande koppeling is niet meer beschikbaar."}),
                          
                                                      currentAssignment.ProjectKey <> projectKeyValue ||
                                                      currentAssignment.Team.Value <> chosenTeam.Value,
                                                      Collect(colAssignmentErrors,{WorkerID:removedAssignment.Worker.Id,Message:"Een koppeling is ondertussen naar een ander project of team gewijzigd. Kies het team opnieuw."}),
                          
                                                      Collect(colTeamToDeactivate,{ID:currentAssignment.ID,WorkerID:removedAssignment.Worker.Id})
                                                  )
                                              )
                                          )
                                      );
                          
                                      If(IsEmpty(colAssignmentErrors),
                                          IfError(CountRows(ClearCollect(colTeamPatched,Patch(
                                              'Project Workers',
                                              ForAll(
                                                  colTeamSelectionToSave As person,
                                                  With(
                                                      {
                                                          existingAssignment: LookUp(
                                                              colTeamSaveCheck As stored,
                                                              stored.AssignmentKey = varTeamSaveProjectKey & "|" & Text(person.ID)
                                                          )
                                                      },
                                                      If(
                                                          IsBlank(existingAssignment.ID),
                                                          Defaults('Project Workers'),
                                                          existingAssignment
                                                      )
                                                  )
                                              ),
                                              ForAll(
                                                  colTeamSelectionToSave As person,
                                                  {
                                                      Title: Left(
                                                          Trim(
                                                              person.'First Name' &
                                                              " " &
                                                              person.Surname
                                                          ) &
                                                          " | " &
                                                          chosenProject.Value,
                                                          255
                                                      ),
                                                      AssignmentKey: projectKeyValue & "|" & Text(person.ID),
                                                      ProjectKey: projectKeyValue,
                                                      Project: chosenProject,
                                                      Worker: {
                                                          Id: person.ID,
                                                          Value: Trim(
                                                              person.'First Name' &
                                                              " " &
                                                              person.Surname
                                                          )
                                                      },
                                                      Team: chosenTeam,
                                                      Active: true
                                                  }
                                              )
                                          )))>=0,
                                              Collect(colAssignmentErrors,{WorkerID:0,Message:FirstError.Message});false);
                                          If(CountRows(colTeamPatched)<>CountRows(colTeamSelectionToSave) || CountIf(colTeamPatched,IsBlank(ID))>0,
                                              Collect(colAssignmentErrors,{WorkerID:0,Message:"De koppeling leverde geen SharePoint-ID op."})
                                          )
                                      );
                          
                                      If(IsEmpty(colAssignmentErrors) && !IsEmpty(colTeamToDeactivate),
                                          IfError(CountRows(ClearCollect(colTeamDeactivated,Patch(
                                              'Project Workers',
                                              ForAll(colTeamToDeactivate As removed,LookUp(colTeamSaveCheck As stored,stored.ID = removed.ID)),
                                              ForAll(colTeamToDeactivate As removed,{Active: false})
                                          )))>=0,
                                              Collect(colAssignmentErrors,{WorkerID:0,Message:FirstError.Message});false);
                                          If(CountRows(colTeamDeactivated)<>CountRows(colTeamToDeactivate) || CountIf(colTeamDeactivated,IsBlank(ID))>0,
                                              Collect(colAssignmentErrors,{WorkerID:0,Message:"De toewijzing kon niet worden gedeactiveerd."})
                                          )
                                      );
                          
                                      If(
                                          IsEmpty(colAssignmentErrors),
                          
                                          Notify(
                                              "Teamwijzigingen opgeslagen. Bestaande koppelingen worden opnieuw gelezen.",
                                              NotificationType.Success
                                          ),
                          
                                          Notify(
                                              "Niet alle wijzigingen zijn opgeslagen: " &
                                              First(colAssignmentErrors).Message,
                                              NotificationType.Error,
                                              15000
                                          )
                                      )
                                  ),
                                  Collect(colAssignmentErrors,{WorkerID:0,Message:FirstError.Message}); Notify(
                                      "Team opslaan gestopt: " &
                                      FirstError.Message,
                                      NotificationType.Error,
                                      15000
                                  )
                              );
                          
                              Set(varSaving, false)
                          );
                          Set(varSelectionLoaded,false); Set(varSelectionKeysValid,false); If(IsEmpty(colAssignmentErrors),Set(varTeamDirty,false); Set(varTeamLoadState,"NotLoaded"); Select(btnReadTeam),Set(varTeamLoadState,"Failed"); Notify("Opslag mogelijk gedeeltelijk uitgevoerd. Selectie behouden; opslaan geblokkeerd. Controleer SharePoint-versies voordat u opnieuw laadt.",NotificationType.Error,15000)),
                          Notify("Save team geblokkeerd: selectie niet volledig geladen, gewijzigd, leeg of niet passend bij huidig project/team.",NotificationType.Error,15000))
                        PressedColor: =ColorValue("#000F41")
                        PressedFill: =ColorValue("#18DD6E")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: =If(varSaving, "Saving...", "Save team")
                        X: =Parent.Width-lblFooterButtonMetrics.X-Self.Width
                        Y: =lblFooterButtonMetrics.Y
