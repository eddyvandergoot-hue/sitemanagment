                          Set(varSelectionLoaded,false); Set(varSelectionKeysValid,false); If(IsEmpty(colAssignmentErrors),Set(varTeamDirty,false); Set(varForceTeamRefresh,true); Set(varTeamLoadState,"NotLoaded"); Select(btnReadTeam),Set(varTeamLoadState,"Failed"); Notify("Opslag mogelijk gedeeltelijk uitgevoerd. Selectie behouden; opslaan geblokkeerd. Controleer SharePoint-versies voordat u opnieuw laadt.",NotificationType.Error,15000)),
