                                                  KeyValue: r.FriKey,
                                                  NewHours: r.FriHours,
                                                  OldHours: original.FriHours
                                              },
                                              {
                                                  DayIndex: 5,
                                                  KeyValue: r.SatKey,
                                                  NewHours: r.SatHours,
                                                  OldHours: original.SatHours
                                              },
                                              {
                                                  DayIndex: 6,
                                                  KeyValue: r.SunKey,
                                                  NewHours: r.SunHours,
                                                  OldHours: original.SunHours
                                              }
                                          ) As d,
                                          If(
                                              IsBlank(d.NewHours) <> IsBlank(d.OldHours) ||
                                              Coalesce(d.NewHours, 0) <> Coalesce(d.OldHours, 0),
                                              Collect(
                                                  colHoursChanges,
                                                  {
                                                      AssignmentID: r.ID,
                                                      WorkerID: r.Worker.Id,
                                                      WorkerName: r.Worker.Value,
                                                      TeamValue: r.Team.Value,
                                                      DayIndex: d.DayIndex,
                                                      KeyValue: d.KeyValue,
                                                      NewHours: d.NewHours,
                                                      OldHours: d.OldHours
                                                  }
                                              )
                                          )
                                      )
                                  )
                              );
                          
                              If(
                                  IsBlank(varLoadedWeekMonday) || IsEmpty(colWeekRows),
                                  Notify(
                                      "Open eerst een project, team en werkweek.",
                                      NotificationType.Warning
                                  ),
                          
                                  IsEmpty(colHoursChanges),
                                  Notify(
                                      "Geen gewijzigde uren.",
                                      NotificationType.Information
                                  ),
                          
                                  CountIf(
                                      colHoursChanges,
                                      !IsBlank(NewHours) &&
                                      (
                                          NewHours < 0 ||
                                          NewHours > 24 ||
                                          Abs(
                                              NewHours * 100 -
                                              Round(NewHours * 100, 0)
                                          ) > 0.000001
                                      )
                                  ) > 0,
                                  Notify(
                                      "Gebruik 0 t/m 24 uur, met maximaal twee decimalen.",
                                      NotificationType.Error
                                  ),
                          
                                  CountIf(
                                      colHoursChanges,
                                      IsBlank(NewHours) && !IsBlank(OldHours)
                                  ) > 0,
                                  Notify(
                                      "Gebruik 0 om eerder ingevulde uren te corrigeren naar geen gewerkte uren.",
                                      NotificationType.Warning
                                  ),
                          
                                  ForAll(
                                      colHoursChanges As c,
                                      IfError(
                                          With(
                                              {
                                                  existing: LookUp(
                                                      Hours,
                                                      EntryKey = c.KeyValue
                                                  ),
                                                  workerRecord: LookUp(
                                                      Workers,
                                                      ID = c.WorkerID
                                                  ),
                                                  workDate: DateAdd(
                                                      varLoadedWeekMonday,
                                                      c.DayIndex,
                                                      TimeUnit.Days
                                                  )
                                              },
                                              If(
                                                  !IsBlank(existing.ID) && (existing.Assignment.Id<>c.AssignmentID || IsBlank(existing.'Work Date') || Date(Year(existing.'Work Date'),Month(existing.'Work Date'),Day(existing.'Work Date'))<>workDate),
                          Error({Kind:ErrorKind.Validation,Message:"De opgeslagen sleutel hoort bij een andere koppeling of werkdatum. Opslaan gestopt; gegevens laten controleren."}),
                          IsBlank(existing.Hours) <> IsBlank(c.OldHours) ||
                                                  Coalesce(existing.Hours, 0) <>
                                                      Coalesce(c.OldHours, 0),
                                                  Error(
                                                      {
                                                          Kind: ErrorKind.Validation,
                                                          Message: "Deze uren zijn sinds het laden gewijzigd. Open de week opnieuw."
                                                      }
                                                  ),
                          
                                                  !IsBlank(existing.ID) &&
                                                  existing.Team.Value <> c.TeamValue,
                                                  Error(
                                                      {
                                                          Kind: ErrorKind.Validation,
                                                          Message: "Deze registratie hoort bij een ander team."
                                                      }
                                                  ),
                          
                                                  With(
                                                      {
                                                          savedRecord: If(
                                                              IsBlank(existing.ID),
                                                              With(
                                                                  {
                                                                      assignmentRecord: LookUp(
                                                                          Choices(Hours.Assignment),
                                                                          Id = c.AssignmentID
                                                                      ),
                                                                      employerRecord: LookUp(
                                                                          Choices(Hours.Employer),
                                                                          Id = workerRecord.Employer.Id
                                                                      ),
                                                                      teamRecord: LookUp(
                                                                          Choices(Hours.Team),
                                                                          Value = c.TeamValue
                                                                      ),
                                                                      tradeRecord: LookUp(
                                                                          Choices(Hours.Trade),
                                                                          Value = workerRecord.Trade.Value
                                                                      )
                                                                  },
                                                                  If(
                                                                      IsBlank(assignmentRecord.Id) ||
                                                                      IsBlank(employerRecord.Id) ||
                                                                      IsBlank(teamRecord.Value) ||
                                                                      IsBlank(tradeRecord.Value),
                                                                      Error(
                                                                          {
                                                                              Kind: ErrorKind.Validation,
                                                                              Message: "Assignment, Employer, Team of Trade ontbreekt."
                                                                          }
                                                                      ),
                          
                                                                      Patch(
                                                                          Hours,
                                                                          Defaults(Hours),
                                                                          {
                                                                              Title: Left(
                                                                                  c.WorkerName & " | " &
                                                                                  Text(
                                                                                      workDate,
                                                                                      "[$-en-GB]dd-mm-yyyy"
                                                                                  ),
                                                                                  255
                                                                              ),
                                                                              EntryKey: c.KeyValue,
                                                                              'Work Date': workDate,
                                                                              Assignment: assignmentRecord,
                                                                              Employer: employerRecord,
                                                                              Team: teamRecord,
                                                                              Trade: tradeRecord,
                                                                              Hours: c.NewHours
                                                                          }
                                                                      )
                                                                  )
                                                              ),
                          
                                                              Patch(
                                                                  Hours,
                                                                  existing,
                                                                  {
                                                                      Title: Left(
                                                                          c.WorkerName & " | " &
                                                                          Text(
                                                                              workDate,
                                                                              "[$-en-GB]dd-mm-yyyy"
                                                                          ),
                                                                          255
                                                                      ),
                                                                      Hours: c.NewHours
                                                                  }
                                                              )
                                                          )
                                                      },
                                                      If(
                                                          IsBlank(savedRecord.ID),
                                                          Error(
                                                              {
                                                                  Kind: ErrorKind.Validation,
                                                                  Message: "Opslaan leverde geen SharePoint-record-ID op."
                                                              }
                                                          ),
                          
                                                          Collect(
                                                              colHoursWritten,
                                                              {
                                                                  SavedID: savedRecord.ID,
                                                                  AssignmentID: c.AssignmentID,
                                                                  WorkerName: c.WorkerName,
                                                                  DayIndex: c.DayIndex,
                                                                  KeyValue: c.KeyValue,
                                                                  ExpectedHours: c.NewHours
                                                              }
                                                          );
                                                          true
                                                      )
                                                  )
                                              )
                                          ),
                                          Collect(
                                              colHoursErrors,
                                              {
                                                  WorkerName: c.WorkerName,
                                                  KeyValue: c.KeyValue,
                                                  Message: FirstError.Message
                                              }
                                          );
                                          false
                                      )
                                  );
                          
                                  IfError(Refresh(Hours),Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                          
                                  ForAll(
                                      colHoursWritten As w,
                                      IfError(
                                          With(
                                              {
                                                  verifiedRecord: LookUp(
                                                      Hours,
                                                      ID = w.SavedID
                                                  )
                                              },
                                              If(
                                                  IsBlank(verifiedRecord.ID) ||
                                                  IsBlank(verifiedRecord.Hours) ||
                                                  verifiedRecord.EntryKey <> w.KeyValue ||
                                                  verifiedRecord.Hours <> w.ExpectedHours,
                                                  Error(
                                                      {
                                                          Kind: ErrorKind.Validation,
                                                          Message: "De opgeslagen registratie kon niet correct worden teruggelezen."
                                                      }
                                                  ),
                          
                                                  Switch(
                                                      w.DayIndex,
                          
                                                      0,
                                                      UpdateIf(
                                                          colWeekOriginal,
                                                          ID = w.AssignmentID,
                                                          {MonHours: verifiedRecord.Hours}
                                                      ),
                          
                                                      1,
                                                      UpdateIf(
                                                          colWeekOriginal,
                                                          ID = w.AssignmentID,
                                                          {TueHours: verifiedRecord.Hours}
                                                      ),
                          
                                                      2,
                                                      UpdateIf(
                                                          colWeekOriginal,
                                                          ID = w.AssignmentID,
                                                          {WedHours: verifiedRecord.Hours}
                                                      ),
                          
                                                      3,
                                                      UpdateIf(
                                                          colWeekOriginal,
                                                          ID = w.AssignmentID,
                                                          {ThuHours: verifiedRecord.Hours}
                                                      ),
                          
                                                      4,
                                                      UpdateIf(
                                                          colWeekOriginal,
                                                          ID = w.AssignmentID,
                                                          {FriHours: verifiedRecord.Hours}
                                                      ),
                          
                                                      5,
                                                      UpdateIf(
                                                          colWeekOriginal,
                                                          ID = w.AssignmentID,
                                                          {SatHours: verifiedRecord.Hours}
                                                      ),
                          
                                                      6,
                                                      UpdateIf(
                                                          colWeekOriginal,
                                                          ID = w.AssignmentID,
                                                          {SunHours: verifiedRecord.Hours}
                                                      )
                                                  );
                                                  true
                                              )
                                          ),
                                          Collect(
                                              colHoursErrors,
                                              {
                                                  WorkerName: w.WorkerName,
                                                  KeyValue: w.KeyValue,
                                                  Message: FirstError.Message
                                              }
                                          );
                                          false
                                      )
                                  );
                          
                                  If(
                                      IsEmpty(colHoursErrors) &&
                                      CountRows(colHoursWritten) = CountRows(colHoursChanges),
                                      Notify(
                                          "Werkweek opgeslagen en gecontroleerd. " &
                                          Text(CountRows(colHoursWritten)) &
                                          " dagregistratie(s).",
                                          NotificationType.Success
                                      ),
                          
                                      Notify(
                                          "Niet alles kon worden opgeslagen en gecontroleerd. " &
                                          If(
                                              !IsEmpty(colHoursErrors),
                                              First(colHoursErrors).WorkerName & ": " &
                                              First(colHoursErrors).Message,
                                              "Het aantal opgeslagen registraties wijkt af."
                                          ),
                                          NotificationType.Error,
                                          15000
                                      )
                                  )
                              ),
                              Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message}); Notify(
                                  "Opslagfout: " & FirstError.Message,
                                  NotificationType.Error,
                                  15000
                              )
                          );
                          
                          Set(varWeekSaving, false);
                          If(!IsEmpty(colHoursErrors),Set(varWeekLoadState,"Failed" ); Set(varWeekReady,false); Notify("Opslag niet volledig bevestigd. Invoer behouden; controleer SharePoint-versies voordat u verdergaat.",NotificationType.Error,15000)),
                          Notify("Save week geblokkeerd: week niet volledig geladen, laadfout of selectie komt niet overeen.",NotificationType.Error,15000))
                        PressedColor: =Color.White
                        PressedFill: =ColorValue("#593080")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: =If(varWeekSaving, "Saving...", "Save")
                        Width: =140
                        X: =Parent.Width-lblFooterButtonMetrics.X-Self.Width
                        Y: =lblFooterButtonMetrics.Y
                        Height: =lblFooterButtonMetrics.Height
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
