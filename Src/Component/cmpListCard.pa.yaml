ComponentDefinitions:
  cmpListCard:
    DefinitionType: CanvasComponent
    Description: 'Admin screen list card (Admin screen pattern): white card (radius 8, DropShadow.Light, padding 24) with search field, one info row (count left, Show inactive switch right) and a gallery of rows (height 64). Presentation only: the host filters (Show inactive) and sorts and passes the rows with a SearchKey column; the component applies only its own search text to SearchKey (local table, no data source) and counts the shown rows itself (CountFormat). Microsoft known limitation: an instance input must never reference an output of the same (or another instance of the same) component, so the host never reads SearchText or Items back in an input. Selection contract - the host passes SelectedID and handles OnSelectRow (no parameters) with its guard as the first condition, reading the clicked row from Output SelectedRowID; the component highlights the row where ID = SelectedID and only raises the event while Enabled is true. Switch contract - the host passes ShowInactive and handles OnToggleShowInactive by flipping its own variable (guard first); the component never flips the state itself. Search contract - the component filters Items with IsBlank(Trim(search)) || Lower(Trim(search)) in Lower(SearchKey); the host may read Output SearchText only in behaviour formulas (for example its loader auto-select). No OnReset and no RaiseOnReset (no preview-only component features, AGENTS): the search text stays until the user clears it.'
    CustomProperties:
      Items:
        PropertyKind: Input
        DataType: Table
        Description: 'Rows, filtered (Show inactive) and sorted by the host, not by the search. Columns ID (Number), Title (Text), Subtitle (Text), Inactive (Boolean, grey title), ChipText (Text, empty = no chip), SearchKey (Text, lower-case search text, for example name, code and city joined with spaces). Allowed ChipText values are Inactive, On hold and Closed (80 px chip, Inter 12, measured text at most 64 px); other texts need a new measurement.'
        Default: '=Table({ID: 0, Title: "", Subtitle: "", Inactive: false, ChipText: "", SearchKey: ""})'
      SelectedID:
        PropertyKind: Input
        DataType: Number
        Description: ID of the selected row (0 or no match = no highlight; SharePoint IDs start at 1).
        Default: =0
      SearchHint:
        PropertyKind: Input
        DataType: Text
        Description: Placeholder and accessible label of the search field.
        Default: =""
      CountFormat:
        PropertyKind: Input
        DataType: Text
        Description: Count text with {0} for the number of shown rows (after the search), for example {0} contractors (plain text, escaped by the component).
        Default: ="{0}"
      ShowInactiveText:
        PropertyKind: Input
        DataType: Text
        Description: Label of the switch, for example Show inactive (plain text, escaped by the component).
        Default: =""
      OnText:
        PropertyKind: Input
        DataType: Text
        Description: Word for the switch state on, used in the tooltip.
        Default: ="On"
      OffText:
        PropertyKind: Input
        DataType: Text
        Description: Word for the switch state off, used in the tooltip.
        Default: ="Off"
      ShowInactive:
        PropertyKind: Input
        DataType: Boolean
        Description: Switch state (true = on).
        Default: =false
      Enabled:
        PropertyKind: Input
        DataType: Boolean
        Description: Guard for search, row selection and the switch (true = Edit, false = Disabled). Fail-closed default.
        Default: =false
      SearchText:
        PropertyKind: Output
        DataType: Text
        Description: Current text of the search field. Read it only in behaviour formulas (for example the loader auto-select), never in an input of a cmpListCard instance (circular reference).
      ShowInactiveValue:
        PropertyKind: Output
        DataType: Boolean
        Description: Echo of the ShowInactive input (the component keeps no state of its own).
      SelectedRowID:
        PropertyKind: Output
        DataType: Number
        Description: ID of the row the user clicked last (0 = none). Read it in the OnSelectRow handler.
      OnSelectRow:
        PropertyKind: Event
        ReturnType: None
        Description: A row was selected; the row ID is in Output SelectedRowID. No event parameters (AGENTS). Only raised while Enabled is true. The host handler starts with its guard.
        Default: =false
      OnToggleShowInactive:
        PropertyKind: Event
        ReturnType: None
        Description: The switch was pressed. Only raised while Enabled is true. The host handler starts with its guard and flips its own variable.
        Default: =false
    Properties:
      Fill: =Color.Transparent
      Height: =600
      SearchText: =txtCmpListSearch.Text
      SelectedRowID: =Coalesce(galCmpList.Selected.ID,0)
      ShowInactiveValue: =cmpListCard.ShowInactive
      Width: =360
    Children:
      - conCmpListCard:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =Color.White
            Height: =Parent.Height
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - txtCmpListSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: =cmpListCard.SearchHint
                  Align: =Align.Left
                  BorderColor: =ColorValue("#9B9B9B")
                  BorderThickness: =1
                  Color: =ColorValue("#000000")
                  Default: =""
                  DisabledBorderColor: =ColorValue("#9B9B9B")
                  DisabledColor: =ColorValue("#000000")
                  DisabledFill: =Color.White
                  DisplayMode: =If(cmpListCard.Enabled,DisplayMode.Edit,DisplayMode.Disabled)
                  Fill: =Color.White
                  FocusedBorderColor: =ColorValue("#0303B8")
                  FocusedBorderThickness: =2
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Height: =36
                  HintText: =cmpListCard.SearchHint
                  HoverBorderColor: =ColorValue("#5A5A5A")
                  HoverColor: =ColorValue("#000000")
                  HoverFill: =Color.White
                  MaxLength: =255
                  PaddingLeft: =40
                  PaddingRight: =12
                  PressedBorderColor: =ColorValue("#0303B8")
                  PressedColor: =ColorValue("#000000")
                  PressedFill: =Color.White
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Size: =14
                  Width: =Parent.Width-48
                  X: =24
                  Y: =24
            - icoCmpListSearch:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =""
                  Color: =ColorValue("#5A5A5A")
                  Height: =18
                  Icon: =Icon.Search
                  Width: =18
                  X: =txtCmpListSearch.X+12
                  Y: =txtCmpListSearch.Y+(txtCmpListSearch.Height-Self.Height)/2
            - htmlCmpListInfo:
                Control: HtmlViewer@2.1.0
                Properties:
                  AutoHeight: =false
                  Color: =ColorValue("#000000")
                  Fill: =Color.Transparent
                  Font: ="Inter, Arial, sans-serif"
                  Height: =26
                  HtmlText: ="<style>html,body{margin:0;padding:0;overflow:hidden}</style><div style='margin:0;padding:0;overflow:hidden;display:flex;width:100%;font-family:Inter,Arial,sans-serif;font-size:13px;line-height:24px;color:#000000'><span style='flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>" & Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(cmpListCard.CountFormat,"{0}",Text(CountRows(Filter(cmpListCard.Items,IsBlank(Trim(txtCmpListSearch.Text)) || Lower(Trim(txtCmpListSearch.Text)) in Lower(SearchKey))))),"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</span><span style='flex:none;white-space:nowrap;text-align:right;padding-left:8px'>" & Substitute(Substitute(Substitute(Substitute(Substitute(cmpListCard.ShowInactiveText,"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</span></div>"
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Width: =Max(0,btnCmpListSwitch.X-8-Self.X)
                  X: =24
                  Y: =txtCmpListSearch.Y+txtCmpListSearch.Height+12
            - btnCmpListSwitch:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =Color.Transparent
                  DisabledColor: =Color.White
                  DisabledFill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  DisplayMode: =If(cmpListCard.Enabled,DisplayMode.Edit,DisplayMode.Disabled)
                  Fill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Height: =24
                  HoverBorderColor: =Color.Transparent
                  HoverColor: =Color.White
                  HoverFill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  OnSelect: =If(cmpListCard.Enabled,cmpListCard.OnToggleShowInactive())
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PressedBorderColor: =Color.Transparent
                  PressedColor: =Color.White
                  PressedFill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Size: =12
                  Text: =""
                  TabIndex: =-1
                  Tooltip: '=cmpListCard.ShowInactiveText & ": " & If(cmpListCard.ShowInactive,cmpListCard.OnText,cmpListCard.OffText)'
                  Width: =44
                  X: =Parent.Width-24-Self.Width
                  Y: =htmlCmpListInfo.Y+1
            - btnCmpListKnob:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =Color.Transparent
                  DisabledColor: =Color.White
                  DisabledFill: =Color.White
                  DisplayMode: =btnCmpListSwitch.DisplayMode
                  Fill: =Color.White
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Height: =18
                  HoverBorderColor: =Color.Transparent
                  HoverColor: =Color.White
                  HoverFill: =Color.White
                  OnSelect: =Select(btnCmpListSwitch)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PressedBorderColor: =Color.Transparent
                  PressedColor: =Color.White
                  PressedFill: =Color.White
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  Size: =12
                  Text: =""
                  TabIndex: =-1
                  Tooltip: =btnCmpListSwitch.Tooltip
                  Width: =18
                  X: =btnCmpListSwitch.X+If(cmpListCard.ShowInactive,btnCmpListSwitch.Width-Self.Width-3,3)
                  Y: =btnCmpListSwitch.Y+3
            - galCmpList:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  DisplayMode: =DisplayMode.Edit
                  Fill: =Color.White
                  Height: =Max(0,Parent.Height-Self.Y-12)
                  Items: =Filter(cmpListCard.Items,IsBlank(Trim(txtCmpListSearch.Text)) || Lower(Trim(txtCmpListSearch.Text)) in Lower(SearchKey))
                  OnSelect: =If(cmpListCard.Enabled && !IsBlank(galCmpList.Selected.ID),cmpListCard.OnSelectRow())
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =0
                  TemplateSize: =64
                  Width: =Parent.Width
                  X: =0
                  Y: =htmlCmpListInfo.Y+htmlCmpListInfo.Height+12
                Children:
                  - recCmpRowFill:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =If(ThisItem.ID=cmpListCard.SelectedID,ColorValue("#D5EDFF"),Color.White)
                        Height: =Parent.TemplateHeight
                        HoverFill: =If(ThisItem.ID=cmpListCard.SelectedID,ColorValue("#D5EDFF"),ColorValue("#F0F0F0"))
                        PressedFill: =If(ThisItem.ID=cmpListCard.SelectedID,ColorValue("#D5EDFF"),ColorValue("#F0F0F0"))
                        TabIndex: =-1
                        Width: =Parent.TemplateWidth
                  - recCmpRowBar:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =ColorValue("#0303B8")
                        Height: =Parent.TemplateHeight
                        Visible: =ThisItem.ID=cmpListCard.SelectedID
                        TabIndex: =-1
                        Width: =3
                  - recCmpRowLine:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =ColorValue("#EDEDED")
                        Height: =1
                        TabIndex: =-1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight-1
                  - htmlCmpRowTitle:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =false
                        Color: =If(ThisItem.Inactive,ColorValue("#6B6B6B"),ColorValue("#000F41"))
                        Fill: =Color.Transparent
                        Font: ="Inter, Arial, sans-serif"
                        Height: =24
                        HtmlText: ="<style>html,body{margin:0;padding:0;overflow:hidden}</style><div style='margin:0;padding:0;overflow:hidden;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:600;line-height:22px;color:" & If(ThisItem.Inactive,"#6B6B6B","#000F41") & "'>" & Substitute(Substitute(Substitute(Substitute(Substitute(ThisItem.Title,"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =15
                        Tooltip: =ThisItem.Title
                        Width: =Max(0,Parent.TemplateWidth-Self.X-If(IsBlank(ThisItem.ChipText),16,16+btnCmpRowChip.Width+8))
                        X: =16
                        Y: =10
                  - htmlCmpRowSub:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =false
                        Color: =ColorValue("#5A5A5A")
                        Fill: =Color.Transparent
                        Font: ="Inter, Arial, sans-serif"
                        Height: =20
                        HtmlText: ="<style>html,body{margin:0;padding:0;overflow:hidden}</style><div style='margin:0;padding:0;overflow:hidden;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Inter,Arial,sans-serif;font-size:13px;line-height:18px;color:#5A5A5A'>" & Substitute(Substitute(Substitute(Substitute(Substitute(ThisItem.Subtitle,"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Tooltip: =ThisItem.Subtitle
                        Width: =Max(0,Parent.TemplateWidth-Self.X-16)
                        X: =16
                        Y: =34
                  - btnCmpRowChip:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Center
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =ColorValue("#000000")
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ColorValue("#000000")
                        DisabledFill: =ColorValue("#E6E6E6")
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorValue("#E6E6E6")
                        Font: ="Inter, Arial, sans-serif"
                        FontWeight: =FontWeight.Normal
                        Height: =20
                        HoverBorderColor: =Color.Transparent
                        HoverColor: =ColorValue("#000000")
                        HoverFill: =ColorValue("#E6E6E6")
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Color.Transparent
                        PressedColor: =ColorValue("#000000")
                        PressedFill: =ColorValue("#E6E6E6")
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =12
                        Text: =ThisItem.ChipText
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =!IsBlank(ThisItem.ChipText)
                        Width: =80
                        X: =Parent.TemplateWidth-16-Self.Width
                        Y: =13
                  - btnCmpRowHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.Transparent
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =Color.Transparent
                        DisabledFill: =Color.Transparent
                        DisplayMode: =DisplayMode.Edit
                        Fill: =Color.Transparent
                        Font: ="Inter, Arial, sans-serif"
                        FontWeight: =FontWeight.Normal
                        Height: =Parent.TemplateHeight
                        HoverBorderColor: =Color.Transparent
                        HoverColor: =Color.Transparent
                        HoverFill: =If(cmpListCard.Enabled,ColorValue("#F0F0F099"),Color.Transparent)
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Color.Transparent
                        PressedColor: =Color.Transparent
                        PressedFill: =Color.Transparent
                        Size: =12
                        TabIndex: =-1
                        Text: =""
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
