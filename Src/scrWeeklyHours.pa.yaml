                - lblReportFromWeek:
                    Control: Label@2.5.1
                    Properties:
                      Text: =If(IsBlank(varReportStartMonday),"",Text(Year(DateAdd(varReportStartMonday,3,TimeUnit.Days)),"0000") & " KW" & Text(ISOWeekNum(varReportStartMonday),"00"))
                      X: =lblReportFrom.X
                      Y: =lblReportFrom.Y
                      Width: =lblReportFrom.Width
                      Height: =lblReportFrom.Height
                      Align: =Align.Right
                      Font: ="Inter, Arial, sans-serif"
                      FontWeight: =FontWeight.Normal
                      Size: =12
                      Color: =ColorValue("#000000")
                - dpReportFrom:
                    Control: ModernDatePicker@1.0.0
                    Properties:
                      BorderColor: =ColorValue("#DCDCDC")
                      AccessibleLabel: '="From: Monday of the first report week"'
                      DefaultDate: =Coalesce(varReportFromPickedDay,varReportStartMonday)
                      Format: ="dd-mm-yyyy"
                      StartOfWeek: =StartOfWeek.Monday
                      StartDate: =Coalesce(varReportMinMonday,Date(1900,1,1))
                      EndDate: =Coalesce(varReportMaxSunday,Date(2200,12,31))
                      OnChange: |-
                        =If(!varReportBusy,
                         If(IsBlank(Self.SelectedDate),Set(varReportFromPickedDay,Blank()); Reset(dpReportFrom),
                          With({selectedDay:Date(Year(Self.SelectedDate),Month(Self.SelectedDate),Day(Self.SelectedDate))},
                           With({monday:DateAdd(selectedDay,1-Weekday(selectedDay,StartOfWeek.Monday),TimeUnit.Days)},
                            Set(varReportFromPickedDay,selectedDay);
                            If(monday<>varReportStartMonday,Set(varReportStartMonday,monday); Set(varReportValid,false); Select(btnBuildReport))
                           )
                          )
                         )
                        )
                      DisplayMode: =If(varReportBusy || !varReportReady || IsBlank(varReportMinMonday) || IsBlank(varReportMaxSunday),DisplayMode.Disabled,DisplayMode.Edit)
                      X: =lblReportFrom.X
                      Y: =lblReportFrom.Y+lblReportFrom.Height+4
                      Width: =lblSummaryFieldWidth.Width
                      Height: =36
                      Font: ="Inter, Arial, sans-serif"
                      FontWeight: =FontWeight.Normal
                      Size: =12
                      Color: =ColorValue("#000000")
                      Fill: =ColorValue("#F0F0F0")
                      BorderThickness: =1
                - lblReportUntil:
                    Control: Label@2.5.1
                    Properties:
                      Text: ="Till"
                      X: =lblReportFrom.X
                      Y: =dpReportFrom.Y+dpReportFrom.Height+12
                      Width: =dpReportUntil.Width
                      Height: =24
                      Font: ="Inter, Arial, sans-serif"
                      FontWeight: =FontWeight.Bold
                      Size: =12
                      Color: =ColorValue("#000000")
                - lblReportUntilWeek:
                    Control: Label@2.5.1
                    Properties:
                      Text: =If(IsBlank(varReportEndSunday),"",Text(Year(DateAdd(varReportEndSunday,-3,TimeUnit.Days)),"0000") & " KW" & Text(ISOWeekNum(varReportEndSunday),"00"))
                      X: =lblReportUntil.X
                      Y: =lblReportUntil.Y
                      Width: =lblReportUntil.Width
                      Height: =lblReportUntil.Height
                      Align: =Align.Right
                      Font: ="Inter, Arial, sans-serif"
                      FontWeight: =FontWeight.Normal
                      Size: =12
                      Color: =ColorValue("#000000")
                - dpReportUntil:
                    Control: ModernDatePicker@1.0.0
                    Properties:
                      BorderColor: =ColorValue("#DCDCDC")
                      AccessibleLabel: '="Till: Sunday of the last report week"'
                      DefaultDate: =Coalesce(varReportUntilPickedDay,varReportEndSunday)
                      Format: ="dd-mm-yyyy"
                      StartOfWeek: =StartOfWeek.Monday
                      StartDate: =Coalesce(varReportMinMonday,Date(1900,1,1))
                      EndDate: =Coalesce(varReportMaxSunday,Date(2200,12,31))
                      OnChange: |-
                        =If(!varReportBusy,
                         If(IsBlank(Self.SelectedDate),Set(varReportUntilPickedDay,Blank()); Reset(dpReportUntil),
                          With({selectedDay:Date(Year(Self.SelectedDate),Month(Self.SelectedDate),Day(Self.SelectedDate))},
                           With({sunday:DateAdd(selectedDay,7-Weekday(selectedDay,StartOfWeek.Monday),TimeUnit.Days)},
                            Set(varReportUntilPickedDay,selectedDay);
                            If(sunday<>varReportEndSunday,Set(varReportEndSunday,sunday); Set(varReportValid,false); Select(btnBuildReport))
                           )
                          )
                         )
                        )
                      DisplayMode: =If(varReportBusy || !varReportReady || IsBlank(varReportMinMonday) || IsBlank(varReportMaxSunday),DisplayMode.Disabled,DisplayMode.Edit)
                      ValidationState: =If(!IsBlank(varReportStartMonday) && !IsBlank(varReportEndSunday) && varReportEndSunday<varReportStartMonday,ValidationState.Error,ValidationState.None)
                      X: =lblReportFrom.X
                      Y: =lblReportUntil.Y+lblReportUntil.Height+4
                      Width: =lblSummaryFieldWidth.Width
                      Height: =36
                      Font: ="Inter, Arial, sans-serif"
                      FontWeight: =FontWeight.Normal
                      Size: =12
                      Color: =ColorValue("#000000")
                      Fill: =ColorValue("#F0F0F0")
                      BorderThickness: =1
    - btnLoadReport:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="Read"
          Visible: =false
          Width: =1
          Height: =1
          OnSelect: |-
            =If(!varReportBusy,
             Set(varReportBusy,true); Set(varReportLoadState,"Loading"); Set(varReportReady,false); Set(varReportValid,false);
             Set(varDiagReportT0,Now()); Trace("DIAG|Report|Start",TraceSeverity.Information,{Scenario:"Report",Step:"Start",ProjectID:Coalesce(ddReportProject.Selected.ID,0),Forced:Coalesce(varReportForceRefresh,false),ProjectsCached:Coalesce(varProjectsCacheReady,false),WorkersCached:Coalesce(varWorkersCacheReady,false)});
             Set(varReportProjectID,ddReportProject.Selected.ID); Set(varReportHoursPaged,false);
             Clear(colReportLoadErrors); Clear(colReportFacts); Clear(colReportRows);
             Clear(colReportColumns); Clear(colReportSelectedHours); Clear(colReportAssignments);
             Clear(colReportWorkers); Clear(colReportPeriods); Clear(colReportHourStaging); Clear(colReportAssignmentPeriods);
             Clear(colReportContractors); Clear(colReportContractorCandidates);
             Set(varReportMinMonday,Blank()); Set(varReportMaxSunday,Blank()); Set(varReportCurrentMonday,Blank());
             If(Coalesce(varReportForceRefresh,false),
              IfError(Refresh(Projects),Collect(colReportLoadErrors,{Message:FirstError.Message});false);
              IfError(Refresh(Workers),Collect(colReportLoadErrors,{Message:FirstError.Message});false)
             );
             If(IsEmpty(colReportLoadErrors) && (Coalesce(varReportForceRefresh,false) || !Coalesce(varProjectsCacheReady,false)),
              IfError(CountRows(ClearCollect(colPendingProjects,ForAll(Sort(Projects,Title,SortOrder.Ascending) As project,{ID:project.ID,Title:project.Title,'Project Number':project.'Project Number','Project Reference':project.'Project Reference'})))>=0,
               Collect(colReportLoadErrors,{Message:"Projects: " & FirstError.Message});false);
              If(CountRows(colPendingProjects)>=500,
               Collect(colReportLoadErrors,{Message:"Projectkeuze mogelijk onvolledig (500 projecten). Rapportage gestopt; een zoekbare projectselectie is nodig."})
              );
              If(IsEmpty(colReportLoadErrors),ClearCollect(colProjectsCache,colPendingProjects); Set(varProjectsCacheReady,true))
             );
             If(IsEmpty(colReportLoadErrors) && (Coalesce(varReportForceRefresh,false) || !Coalesce(varWorkersCacheReady,false)),
              IfError(CountRows(ClearCollect(colPendingWorkers,ForAll(Workers As worker,{ID:worker.ID,'First Name':worker.'First Name',Surname:worker.Surname,'Employer Name':worker.Employer.Value,Employer:worker.Employer,Trade:worker.Trade})))>=0,
               Collect(colReportLoadErrors,{Message:"Workers: " & FirstError.Message});false);
              If(CountRows(colPendingWorkers)>=500,
               Collect(colReportLoadErrors,{Message:"500 medewerkers geladen; medewerkerslijst mogelijk onvolledig. Rapportage gestopt."})
              );
              If(IsEmpty(colReportLoadErrors),ClearCollect(colWorkersCache,colPendingWorkers); Set(varWorkersCacheReady,true))
             );
             If(IsEmpty(colReportLoadErrors),ClearCollect(colReportProjects,colProjectsCache));
             If(CountRows(colReportProjects)>=500,
              Collect(colReportLoadErrors,{Message:"Projectkeuze mogelijk onvolledig (500 projecten). Rapportage gestopt; een zoekbare projectselectie is nodig."})
             );
             If(IsEmpty(colReportLoadErrors),Reset(ddReportProject); Set(varReportProjectID,ddReportProject.Selected.ID); Set(varReportProjectKey,Text(varReportProjectID)));
             Trace("DIAG|Report|AfterMasters",TraceSeverity.Information,{Scenario:"Report",Step:"AfterMasters",ElapsedMs:DateDiff(varDiagReportT0,Now(),TimeUnit.Milliseconds),Projects:CountRows(colReportProjects),Workers:CountRows(colWorkersCache),Errors:CountRows(colReportLoadErrors)});
             If(IsEmpty(colReportLoadErrors) && !IsBlank(varReportProjectID),
              IfError(Refresh(Hours),Collect(colReportLoadErrors,{Message:FirstError.Message});false);
              IfError(Refresh('Project Workers'),Collect(colReportLoadErrors,{Message:FirstError.Message});false);
              If(IsEmpty(colReportLoadErrors),
               IfError(CountRows(ClearCollect(colReportAssignments,
                Filter('Project Workers',ProjectKey=varReportProjectKey)))>=0,
                Collect(colReportLoadErrors,{Message:FirstError.Message});false)
              );
              If(CountRows(colReportAssignments)>=500,
               Collect(colReportLoadErrors,{Message:"500 projectkoppelingen geladen. Volledigheid niet gegarandeerd; rapportage gestopt."})
              );
              If(CountIf(colReportAssignments,Project.Id<>varReportProjectID)>0,
               Collect(colReportLoadErrors,{Message:"Een koppeling met de projectsleutel van dit project verwijst naar een ander project. Rapportage gestopt; gegevens laten controleren."})
              );
              If(IsEmpty(colReportLoadErrors),
               IfError(Refresh('Assignment Periods'),Collect(colReportLoadErrors,{Message:"Assignment Periods: " & FirstError.Message});false);
               IfError(CountRows(ClearCollect(colReportAssignmentPeriods,
                ForAll(Filter('Assignment Periods',ProjectKey=varReportProjectKey) As p,{ID:p.ID,AssignmentKey:p.AssignmentKey,ProjectKey:p.ProjectKey,From:If(IsBlank(p.From),Blank(),Date(Year(p.From),Month(p.From),Day(p.From))),Until:If(IsBlank(p.Until),Blank(),Date(Year(p.Until),Month(p.Until),Day(p.Until)))})))>=0,
                Collect(colReportLoadErrors,{Message:"Assignment Periods: " & FirstError.Message});false)
              );
              If(CountRows(colReportAssignmentPeriods)>=500,
               Collect(colReportLoadErrors,{Message:"500 periodes geladen. Volledigheid niet gegarandeerd; rapportage gestopt."})
              );
              If(CountIf(colReportAssignmentPeriods,ProjectKey<>varReportProjectKey || !StartsWith(AssignmentKey,varReportProjectKey & "|"))>0,
               Collect(colReportLoadErrors,{Message:"Een periode met de projectsleutel van dit project heeft een AssignmentKey van een ander project. Rapportage gestopt; gegevens laten controleren."})
              );
              If(IsEmpty(colReportLoadErrors),
               ForAll(Distinct(colReportAssignments,Worker.Id) As person,
                With({profile:LookUp(colWorkersCache,ID=person.Value),
                      activeMember:CountIf(colReportAssignments,Worker.Id=person.Value && Active=true)>0,
                      hasPeriod:CountIf(colReportAssignmentPeriods,AssignmentKey=varReportProjectKey & "|" & Text(person.Value))>0},
                 If(IsBlank(person.Value) || ((activeMember || hasPeriod) && (IsBlank(profile.ID) || IsBlank(profile.Employer.Id))),
                  Collect(colReportLoadErrors,{Message:"Actieve medewerker of werkgever ontbreekt bij worker-ID " & Text(person.Value)});false,
                  CountRows(Collect(colReportWorkers,{WorkerID:person.Value,
                   WorkerName:Coalesce(Trim(profile.'First Name' & " " & profile.Surname),LookUp(colReportAssignments,Worker.Id=person.Value,Worker.Value)),
                   ContractorID:profile.Employer.Id,ContractorName:profile.Employer.Value,IsActive:activeMember,HasPeriod:hasPeriod}))>=0
                 )
                )
               )
              );
              Trace("DIAG|Report|AfterAssignments",TraceSeverity.Information,{Scenario:"Report",Step:"AfterAssignments",ElapsedMs:DateDiff(varDiagReportT0,Now(),TimeUnit.Milliseconds),Assignments:CountRows(colReportAssignments),Periods:CountRows(colReportAssignmentPeriods),Workers:CountRows(colReportWorkers),Errors:CountRows(colReportLoadErrors)});
              If(IsEmpty(colReportLoadErrors),
               Set(varReportQueryPrefix,varReportProjectKey & "|");
                IfError(
                 With({batch:ForAll(Filter(Hours,StartsWith(EntryKey,varReportQueryPrefix)) As entry,
                  {HourID:entry.ID,AssignmentID:entry.Assignment.Id,WorkDay:entry.'Work Date',ContractorID:entry.Employer.Id,
                   ContractorName:entry.Employer.Value,HourValue:entry.Hours})},
                  If(CountRows(batch)<500,
                   CountRows(Collect(colReportHourStaging,batch))>=0,
                   Set(varReportHoursPaged,true); true
                  )
                 ),Collect(colReportLoadErrors,{Message:FirstError.Message});false
                )
              );
              If(IsEmpty(colReportLoadErrors) && varReportHoursPaged,
               Clear(colReportHourStaging);
               Trace("DIAG|Report|PagedByMonth",TraceSeverity.Information,{Scenario:"Report",Step:"PagedByMonth",ElapsedMs:DateDiff(varDiagReportT0,Now(),TimeUnit.Milliseconds)});
                IfError(
                 With({firstHour:First(Sort(Filter(Hours,StartsWith(EntryKey,varReportQueryPrefix)),'Work Date',SortOrder.Ascending)),
                       lastHour:First(Sort(Filter(Hours,StartsWith(EntryKey,varReportQueryPrefix)),'Work Date',SortOrder.Descending))},
                  If(IsBlank(firstHour.'Work Date') || IsBlank(lastHour.'Work Date') || Year(lastHour.'Work Date')-Year(firstHour.'Work Date')>499,
                   Collect(colReportLoadErrors,{Message:"Ongeldig datumbereik in de uren van dit project. Gegevens laten controleren."});false,
                   With({firstMonth:Date(Year(firstHour.'Work Date'),Month(firstHour.'Work Date'),1),
                         monthCount:12*(Year(lastHour.'Work Date')-Year(firstHour.'Work Date'))+Month(lastHour.'Work Date')-Month(firstHour.'Work Date')+1},
                    CountRows(ForAll(Sequence(monthCount) As monthIndex,
                     With({monthFrom:DateAdd(firstMonth,monthIndex.Value-1,TimeUnit.Months),monthUntil:DateAdd(firstMonth,monthIndex.Value,TimeUnit.Months)},
                      IfError(
                       With({monthBatch:ForAll(Filter(Hours,StartsWith(EntryKey,varReportQueryPrefix) && 'Work Date'>=monthFrom && 'Work Date'<monthUntil) As entry,
                        {HourID:entry.ID,AssignmentID:entry.Assignment.Id,WorkDay:entry.'Work Date',ContractorID:entry.Employer.Id,
                         ContractorName:entry.Employer.Value,HourValue:entry.Hours})},
                        If(CountRows(monthBatch)<500,
                         CountRows(Collect(colReportHourStaging,monthBatch))>=0,
                         CountRows(ForAll(Sequence(DateDiff(monthFrom,monthUntil,TimeUnit.Days)) As dayIndex,
                          With({dayFrom:DateAdd(monthFrom,dayIndex.Value-1,TimeUnit.Days),dayUntil:DateAdd(monthFrom,dayIndex.Value,TimeUnit.Days)},
                           IfError(
                            With({dayBatch:ForAll(Filter(Hours,StartsWith(EntryKey,varReportQueryPrefix) && 'Work Date'>=dayFrom && 'Work Date'<dayUntil) As entry,
                             {HourID:entry.ID,AssignmentID:entry.Assignment.Id,WorkDay:entry.'Work Date',ContractorID:entry.Employer.Id,
                              ContractorName:entry.Employer.Value,HourValue:entry.Hours})},
                             If(CountRows(dayBatch)>=500,
                              Collect(colReportLoadErrors,{Message:"Limiet bereikt bij uren op " & Text(dayFrom,"dd-mm-yyyy") & ". Geen totalen getoond."});false,
                              CountRows(Collect(colReportHourStaging,dayBatch))>=0
                             )
                            ),Collect(colReportLoadErrors,{Message:FirstError.Message});false
                           )
                          )
                         ))>=0
                        )
                       ),Collect(colReportLoadErrors,{Message:FirstError.Message});false
                      )
                     )
                    ))>=0
                   )
                  )
                 ),Collect(colReportLoadErrors,{Message:FirstError.Message});false
                )
              );
              If(IsEmpty(colReportLoadErrors),
               If(CountRows(Distinct(colReportHourStaging,HourID))<>CountRows(colReportHourStaging),
                Collect(colReportLoadErrors,{Message:"Dezelfde urenregel is meer dan eens teruggelezen. Geen totalen getoond."})
               );
               If(CountIf(colReportHourStaging,IsBlank(WorkDay) || IsBlank(ContractorID) || IsBlank(HourValue))>0,
                Collect(colReportLoadErrors,{Message:"Urenregel zonder datum, historische werkgever of uren in dit project. Geen totalen getoond."})
               );
               If(CountIf(colReportHourStaging,!(AssignmentID in ShowColumns(colReportAssignments,ID)))>0,
                Collect(colReportLoadErrors,{Message:"Een urenregel met de projectsleutel van dit project hoort niet bij een koppeling van dit project. Gegevens laten controleren; geen totalen getoond."})
               )
              );
              If(IsEmpty(colReportLoadErrors),
               IfError(CountRows(ClearCollect(colReportFacts,ForAll(colReportHourStaging As entry,
                With({workerID:LookUp(colReportAssignments,ID=entry.AssignmentID,Worker.Id),
                      workDay:Date(Year(entry.WorkDay),Month(entry.WorkDay),Day(entry.WorkDay))},
                 With({monday:DateAdd(workDay,1-Weekday(workDay,StartOfWeek.Monday),TimeUnit.Days)},
                  With({isoYearValue:Year(DateAdd(monday,3,TimeUnit.Days))},
                   {HourID:entry.HourID,WorkerID:workerID,
                    WorkerName:LookUp(colReportWorkers,WorkerID=workerID,WorkerName),
                    ContractorID:entry.ContractorID,ContractorName:entry.ContractorName,
                    WorkDay:workDay,Monday:monday,ISOYear:isoYearValue,
                    KW:1+RoundDown(DateDiff(DateAdd(Date(isoYearValue,1,4),1-Weekday(Date(isoYearValue,1,4),StartOfWeek.Monday),TimeUnit.Days),monday,TimeUnit.Days)/7,0),
                    HourValue:entry.HourValue}
                  )
                 )
                )
               )))>=0,Collect(colReportLoadErrors,{Message:FirstError.Message});false)
              );
              Trace("DIAG|Report|AfterHoursQueries",TraceSeverity.Information,{Scenario:"Report",Step:"AfterHoursQueries",ElapsedMs:DateDiff(varDiagReportT0,Now(),TimeUnit.Milliseconds),Paged:Coalesce(varReportHoursPaged,false),StagedRows:CountRows(colReportHourStaging),Facts:CountRows(colReportFacts),Errors:CountRows(colReportLoadErrors)});
              If(IsEmpty(colReportLoadErrors),
               IfError(CountRows(ClearCollect(colReportPeriods,
                Sort(AddColumns(GroupBy(colReportFacts,ISOYear,KW,Monday,PeriodRecords),PeriodKey,ISOYear*100+KW),PeriodKey,SortOrder.Ascending)))>=0,
                Collect(colReportLoadErrors,{Message:FirstError.Message});false);
               Collect(colReportContractorCandidates,{ID:0,Value:"Alle contractors"});
               ForAll(Distinct(colReportFacts,ContractorID) As contractor,
                Collect(colReportContractorCandidates,{ID:contractor.Value,Value:Coalesce(LookUp(colReportFacts,ContractorID=contractor.Value,ContractorName),"Werkgever " & Text(contractor.Value))})
               );
               ForAll(Filter(colReportWorkers,IsActive=true || HasPeriod=true) As person,
                Collect(colReportContractorCandidates,{ID:person.ContractorID,Value:Coalesce(person.ContractorName,"Werkgever " & Text(person.ContractorID))})
               );
               ClearCollect(colReportContractors,DropColumns(AddColumns(GroupBy(colReportContractorCandidates,ID,ContractorRecords),Value,First(ContractorRecords).Value),ContractorRecords));
               If(CountRows(colReportContractors)>500,
                Collect(colReportLoadErrors,{Message:"Meer dan 500 keuzewaarden. Rapportage gestopt om onvolledige keuzes te voorkomen."})
               )
              );
              If(IsEmpty(colReportLoadErrors),
               Set(varReportCurrentMonday,DateAdd(Today(),1-Weekday(Today(),StartOfWeek.Monday),TimeUnit.Days));
               With({periodFrom:First(Sort(Filter(colReportAssignmentPeriods,!IsBlank(From)),From,SortOrder.Ascending)).From,hoursMonday:First(colReportPeriods).Monday},
                With({earliest:If(IsBlank(periodFrom),hoursMonday,IsBlank(hoursMonday),periodFrom,periodFrom<hoursMonday,periodFrom,hoursMonday)},
                 Set(varReportMinMonday,If(IsBlank(earliest),Blank(),DateAdd(earliest,1-Weekday(earliest,StartOfWeek.Monday),TimeUnit.Days)))
                )
               );
               With({currentSunday:DateAdd(varReportCurrentMonday,6,TimeUnit.Days),hoursSunday:If(IsEmpty(colReportPeriods),Blank(),DateAdd(Last(colReportPeriods).Monday,6,TimeUnit.Days))},
                With({upper:If(!IsBlank(hoursSunday) && hoursSunday>currentSunday,hoursSunday,currentSunday)},
                 Set(varReportMaxSunday,If(IsBlank(varReportMinMonday),Blank(),DateAdd(varReportMinMonday,6,TimeUnit.Days)>upper,DateAdd(varReportMinMonday,6,TimeUnit.Days),upper))
                )
               );
               If(IsBlank(varReportMinMonday),
                Set(varReportStartMonday,Blank()); Set(varReportEndSunday,Blank()),
                IsEmpty(colReportPeriods),
                With({defaultMonday:If(varReportMinMonday>varReportCurrentMonday,varReportMinMonday,varReportCurrentMonday)},
                 Set(varReportStartMonday,defaultMonday); Set(varReportEndSunday,DateAdd(defaultMonday,6,TimeUnit.Days))
                ),
                Set(varReportStartMonday,First(colReportPeriods).Monday);
                Set(varReportEndSunday,DateAdd(Last(colReportPeriods).Monday,6,TimeUnit.Days))
               );
               Set(varReportFromPickedDay,Blank()); Set(varReportUntilPickedDay,Blank());
               Reset(ddReportContractor); Reset(dpReportFrom); Reset(dpReportUntil);
               Set(varReportReady,true); Set(varReportLoadState,"Loaded")
              )
             );
             If(!IsEmpty(colReportLoadErrors),
              Set(varReportReady,false); Set(varReportValid,false);
              Clear(colReportFacts); Clear(colReportRows); Clear(colReportColumns); Clear(colReportSelectedHours);
              Clear(colReportPeriods); Clear(colReportContractors); Clear(colReportAssignmentPeriods);
              Set(varReportMinMonday,Blank()); Set(varReportMaxSunday,Blank()); Set(varReportCurrentMonday,Blank());
              Set(varReportStartMonday,Blank()); Set(varReportEndSunday,Blank()); Set(varReportFromPickedDay,Blank()); Set(varReportUntilPickedDay,Blank()); Reset(dpReportFrom); Reset(dpReportUntil);
              Set(varReportLoadState,"Failed"); Set(varReportMessage,"Ophalen gestopt: " & First(colReportLoadErrors).Message);
              Notify(varReportMessage,NotificationType.Error),
              If(IsBlank(varReportProjectID),Set(varReportMessage,"Selecteer een project."))
             );
             Set(varReportForceRefresh,false);
             Trace("DIAG|Report|End",TraceSeverity.Information,{Scenario:"Report",Step:"End",ElapsedMs:DateDiff(varDiagReportT0,Now(),TimeUnit.Milliseconds),State:Coalesce(varReportLoadState,""),Facts:CountRows(colReportFacts),Errors:CountRows(colReportLoadErrors)});
             Set(varReportBusy,false);
             If(varReportReady,Select(btnBuildReport))
            )
