Screens:
  scrWeeklyHours:
    Properties:
      Fill: =Color.White
      LoadingSpinnerColor: =ColorValue("#0303B8")
      OnVisible: =Trace("DIAG|Summary|OnVisible",TraceSeverity.Information,{Scenario:"Summary",Step:"OnVisible",Ready:Coalesce(varReportReady,false),LoadedProjectID:Coalesce(varReportProjectID,0),SelectedProjectID:Coalesce(ddReportProject.Selected.ID,0),WillLoad:!Coalesce(varReportReady,false) || Coalesce(varReportProjectID,0)<>Coalesce(ddReportProject.Selected.ID,0)}); If(!Coalesce(varReportReady,false) || Coalesce(varReportProjectID,0)<>Coalesce(ddReportProject.Selected.ID,0),Select(btnLoadReport))
    Children:
    - lblWeeklyHoursTitle:
        Control: Label@2.5.1
        Properties:
          Color: =Color.White
          Fill: =ColorValue("#0303B8")
          Font: ="Inter, Arial, sans-serif"
          FontWeight: =FontWeight.Semibold
          Height: =56
          PaddingLeft: =129
          Size: =22
          Text: ="Hours Summary"
          Width: =400
          X: =40
          Y: =24
    - imgLogoSummary:
        Control: Image@2.2.3
        Properties:
          AccessibleLabel: ="GEA"
          BorderColor: =Color.Transparent
          BorderThickness: =0
          Height: =30
          Image: =GEA_logo_white
          ImagePosition: =ImagePosition.Fit
          Width: =99
          X: =lblWeeklyHoursTitle.X+15
          Y: =lblWeeklyHoursTitle.Y+(lblWeeklyHoursTitle.Height-Self.Height)/2
    - lblReportProjectDetails:
        Control: Label@2.5.1
        Properties:
          Color: =Color.White
          Fill: =ColorValue("#0303B8")
          Font: ="Inter, Arial, sans-serif"
          FontWeight: =FontWeight.Normal
          Size: =11
          Text: "=If(\n    IsBlank(ddReportProject.Selected.ID),\n    \"Select a project.\",\n    With(\n        {\n            projectRecord: LookUp(\n                colReportProjects,\n                ID = ddReportProject.Selected.ID\n            )\n        },\n        \"Project Number: \" &\n        projectRecord.'Project Number' &\n        \" | Project Reference: \" &\n        projectRecord.'Project Reference'\n    )\n)"
          Width: =Max(0,Parent.Width-80-lblWeeklyHoursTitle.Width)
          X: =lblWeeklyHoursTitle.X+lblWeeklyHoursTitle.Width
          Y: =lblWeeklyHoursTitle.Y
          Height: =lblWeeklyHoursTitle.Height
          Align: =Align.Right
          VerticalAlign: =VerticalAlign.Middle
          PaddingLeft: =12
          PaddingRight: =24
    - btnBuildReport:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="Build"
          X: =0
          Y: =0
          Width: =110
          Height: =36
          OnSelect: |-
            =If(varReportReady && !varReportBusy && varReportProjectID=ddReportProject.Selected.ID,
             Set(varReportValid,false); Clear(colReportBuildErrors); Set(varDiagBuildT0,Now());
             Clear(colReportRows); Clear(colReportColumns); Clear(colReportSelectedHours);
             Set(varReportHasPeriod,!IsEmpty(colReportPeriods));
             If(IsBlank(varReportMinMonday) || IsBlank(varReportMaxSunday),
              Set(varReportMessage,"Geen inzetperiodes of uren voor dit project"),
              If(IsBlank(varReportStartMonday) || IsBlank(varReportEndSunday),
               Collect(colReportBuildErrors,{Message:"Selecteer From en Till."}),
               Set(varReportFrom,varReportStartMonday);
               Set(varReportUntil,DateAdd(varReportEndSunday,1,TimeUnit.Days));
               If(varReportFrom>=varReportUntil,
                Collect(colReportBuildErrors,{Message:"Till ligt vóór From. Kies een eindweek die gelijk is aan of later is dan de beginweek."}),
               If(DateDiff(varReportFrom,varReportUntil,TimeUnit.Days)/7>50000,
                Collect(colReportBuildErrors,{Message:"Kies maximaal 50000 weken."}),
                IfError(CountRows(ClearCollect(colReportSelectedHours,Filter(colReportFacts,
                 WorkDay>=varReportFrom && WorkDay<varReportUntil &&
                 (Coalesce(ddReportContractor.Selected.ID,0)=0 || ContractorID=ddReportContractor.Selected.ID))))>=0,
                 Collect(colReportBuildErrors,{Message:FirstError.Message});false);
                IfError(CountRows(ClearCollect(colReportColumns,
                 ForAll(Sequence(DateDiff(varReportFrom,varReportUntil,TimeUnit.Days)/7) As weekIndex,
                  With({monday:DateAdd(varReportFrom,7*(weekIndex.Value-1),TimeUnit.Days)},
                   With({isoYearValue:Year(DateAdd(monday,3,TimeUnit.Days))},
                    {WeekIndex:weekIndex.Value,Monday:monday,ISOYear:isoYearValue,
                     KW:1+RoundDown(DateDiff(DateAdd(Date(isoYearValue,1,4),1-Weekday(Date(isoYearValue,1,4),StartOfWeek.Monday),TimeUnit.Days),monday,TimeUnit.Days)/7,0)}
                   )
                  )
                 )))>=0,Collect(colReportBuildErrors,{Message:FirstError.Message});false)
               ))
              );
             If(IsEmpty(colReportBuildErrors),
              IfError(CountRows(ClearCollect(colReportRows,
               AddColumns(GroupBy(colReportSelectedHours,WorkerID,ContractorID,WorkerEntries) As reportRow,
                WorkerName,First(reportRow.WorkerEntries).WorkerName,
                ContractorName,First(reportRow.WorkerEntries).ContractorName,
                PeriodTotal,Sum(reportRow.WorkerEntries,HourValue))))>=0,
               Collect(colReportBuildErrors,{Message:FirstError.Message});false);
              Set(varReportZeroFrom,varReportFrom); Set(varReportZeroUntil,varReportUntil);
              ForAll(Filter(colReportWorkers As candidate,candidate.HasPeriod && CountIf(colReportAssignmentPeriods,AssignmentKey=varReportProjectKey & "|" & Text(candidate.WorkerID) && From<varReportZeroUntil && (IsBlank(Until) || Until>=varReportZeroFrom))>0) As person,
               If((Coalesce(ddReportContractor.Selected.ID,0)=0 || person.ContractorID=ddReportContractor.Selected.ID) &&
                  IsBlank(LookUp(colReportRows,WorkerID=person.WorkerID && ContractorID=person.ContractorID)),
                IfError(CountRows(Collect(colReportRows,{WorkerID:person.WorkerID,ContractorID:person.ContractorID,
                 WorkerName:person.WorkerName,ContractorName:person.ContractorName,
                 PeriodTotal:0,WorkerEntries:Filter(colReportSelectedHours,false)}))>=0,
                 Collect(colReportBuildErrors,{Message:FirstError.Message});false)
               )
              )
             );
             If(IsEmpty(colReportBuildErrors),
              Set(varReportColumnOffset,1); Set(varReportValid,true);
              Trace("DIAG|Build|End",TraceSeverity.Information,{Scenario:"Build",Step:"End",ElapsedMs:DateDiff(varDiagBuildT0,Now(),TimeUnit.Milliseconds),Rows:CountRows(colReportRows),Columns:CountRows(colReportColumns),SelectedHours:CountRows(colReportSelectedHours),PeriodTotal:Sum(colReportRows,PeriodTotal)});
              Set(varReportMessage,If(!varReportHasPeriod,"Geen opgeslagen uren voor dit project; medewerkers met een inzetperiode in de gekozen weken staan op 0. ","") &
               Text(CountRows(colReportRows)) & " medewerkers/contractors | " & Text(CountRows(colReportColumns)) & " weken | " &
               Text(Sum(colReportRows,PeriodTotal),If(Sum(colReportRows,PeriodTotal)=Round(Sum(colReportRows,PeriodTotal),0),"[$-en-US]0","[$-en-US]0.00"),"nl-NL") & " uur"),
              Clear(colReportRows); Clear(colReportColumns); Clear(colReportSelectedHours);
              Set(varReportMessage,"Rapport gestopt: " & First(colReportBuildErrors).Message);
              Notify(varReportMessage,NotificationType.Error)
             )
             )
            )
          Visible: =false
          DisplayMode: =DisplayMode.Edit
          Fill: =ColorValue("#0303B8")
          Color: =Color.White
          Font: ="Inter, Arial, sans-serif"
          Size: =11
          RadiusTopLeft: =6
          RadiusTopRight: =6
          RadiusBottomLeft: =6
          RadiusBottomRight: =6
    - lblReportStatus:
        Control: Label@2.5.1
        Properties:
          Text: =If(varReportBusy,"Uren ophalen...",!varReportValid,varReportMessage,IsBlank(varReportProjectID) || varReportHasPeriod,"","Geen opgeslagen uren voor dit project; medewerkers met een inzetperiode in de gekozen weken staan op 0.")
          X: =40
          Y: =conSummarySelectors.Y+conSummarySelectors.Height+If(Len(Self.Text)>0,12,0)
          Width: =Parent.Width-80
          Height: =If(Len(Self.Text)>0,30,0)
          Font: ="Inter, Arial, sans-serif"
          FontWeight: =FontWeight.Normal
          Size: =11
          Color: =ColorValue("#000000")
    - lblReportNameHeader:
        Control: Label@2.5.1
        Properties:
          Text: ="Name"
          X: =40
          Y: =lblReportStatus.Y+lblReportStatus.Height+12
          Width: =220
          Height: =40
          Font: ="Inter, Arial, sans-serif"
          Size: =11
          Color: =Color.White
          Fill: =ColorValue("#0303B8")
          FontWeight: =FontWeight.Semibold
          VerticalAlign: =VerticalAlign.Middle
          PaddingLeft: =8
    - lblReportEmployerHeader:
        Control: Label@2.5.1
        Properties:
          Text: ="Contractor"
          X: =260
          Y: =lblReportNameHeader.Y
          Width: =180
          Height: =40
          Font: ="Inter, Arial, sans-serif"
          Size: =11
          Color: =Color.White
          Fill: =ColorValue("#0303B8")
          FontWeight: =FontWeight.Semibold
          VerticalAlign: =VerticalAlign.Middle
    - galReportWeekHeaders:
        Control: Gallery@2.15.0
        Properties:
          Items: =FirstN(Filter(colReportColumns,WeekIndex>=Min(Coalesce(varReportColumnOffset,1),Max(1,CountRows(colReportColumns)-Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0))+1))),Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0)))
          X: =440
          Y: =lblReportNameHeader.Y
          Width: =Parent.Width-616
          Height: =40
          Fill: =ColorValue("#0303B8")
          TemplateSize: =Max(50,(scrWeeklyHours.Width-616)/Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0)))
          TemplatePadding: =0
          ShowScrollbar: =false
        Variant: Horizontal
        Children:
        - lblReportWeekHeader:
            Control: Label@2.5.1
            Properties:
              Text: =Text(ThisItem.ISOYear)&" KW"&Text(ThisItem.KW,"00")
              X: =0
              Y: =0
              Width: =Max(50,(scrWeeklyHours.Width-616)/Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0)))
              Height: =40
              Font: ="Inter, Arial, sans-serif"
              Size: =10
              Color: =Color.White
              Fill: =ColorValue("#0303B8")
              Align: =Align.Center
              FontWeight: =FontWeight.Semibold
              VerticalAlign: =VerticalAlign.Middle
              PaddingLeft: =0
              PaddingRight: =0
    - lblReportTotalHeader:
        Control: Label@2.5.1
        Properties:
          Text: ="Period total"
          X: =Parent.Width-176
          Y: =lblReportNameHeader.Y
          Width: =120
          Height: =40
          Font: ="Inter, Arial, sans-serif"
          Size: =11
          Color: =Color.White
          Fill: =ColorValue("#0303B8")
          Align: =Align.Center
          FontWeight: =FontWeight.Bold
          VerticalAlign: =VerticalAlign.Middle
    - galReportRows:
        Control: Gallery@2.15.0
        Properties:
          Items: =With({sortedRows:Sort(colReportRows,WorkerName,SortOrder.Ascending)},ForAll(Sequence(CountRows(sortedRows)) As rowNumber,With({reportRow:Index(sortedRows,rowNumber.Value)},{WorkerID:reportRow.WorkerID,ContractorID:reportRow.ContractorID,WorkerName:reportRow.WorkerName,ContractorName:reportRow.ContractorName,PeriodTotal:reportRow.PeriodTotal,WorkerEntries:reportRow.WorkerEntries,RowNumber:rowNumber.Value})))
          X: =40
          Y: =lblReportNameHeader.Y+lblReportNameHeader.Height
          Width: =Parent.Width-80
          Height: =Max(0,Min(44*CountRows(colReportRows),navHoursSummary.Y-12-44-Self.Y))
          TemplateSize: =44
          TemplatePadding: =0
          TemplateFill: =If(Mod(ThisItem.RowNumber,2)=0,ColorValue("#F0F0F0"),ColorValue("#FFFFFF"))
          Visible: =varReportValid
          ShowScrollbar: =true
        Variant: Vertical
        Children:
        - recReportRowLine:
            Control: Rectangle@2.3.0
            Properties:
              X: =0
              Y: =43
              Width: =scrWeeklyHours.Width-96
              Height: =1
              Fill: =ColorValue("#DCDCDC")
        - recReportRowTotalLine:
            Control: Rectangle@2.3.0
            Properties:
              X: =scrWeeklyHours.Width-216
              Y: =0
              Width: =1
              Height: =44
              Fill: =ColorValue("#DCDCDC")
        - lblReportWorkerName:
            Control: Label@2.5.1
            Properties:
              Text: =ThisItem.WorkerName
              X: =0
              Y: =0
              Width: =220
              Height: =44
              Font: ="Inter, Arial, sans-serif"
              FontWeight: =FontWeight.Normal
              Size: =11
              Color: =ColorValue("#000000")
              PaddingLeft: =8
        - lblReportWorkerEmployer:
            Control: Label@2.5.1
            Properties:
              Text: =ThisItem.ContractorName
              X: =220
              Y: =0
              Width: =180
              Height: =44
              Font: ="Inter, Arial, sans-serif"
              FontWeight: =FontWeight.Normal
              Size: =11
              Color: =ColorValue("#000000")
        - galReportWorkerWeeks:
            Control: Gallery@2.15.0
            Properties:
              Items: =With({workerHours:ThisItem.WorkerEntries},AddColumns(FirstN(Filter(colReportColumns,WeekIndex>=Min(Coalesce(varReportColumnOffset,1),Max(1,CountRows(colReportColumns)-Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0))+1))),Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0))) As week,WeekHours,Coalesce(Sum(Filter(workerHours,Monday=week.Monday),HourValue),0)))
              X: =400
              Y: =0
              Width: =scrWeeklyHours.Width-616
              Height: =44
              Fill: =Color.Transparent
              TemplateSize: =Max(50,(scrWeeklyHours.Width-616)/Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0)))
              TemplatePadding: =0
              ShowScrollbar: =false
            Variant: Horizontal
            Children:
            - lblReportWeekHours:
                Control: Label@2.5.1
                Properties:
                  Text: =If(ThisItem.WeekHours=0,"–",Text(ThisItem.WeekHours,If(ThisItem.WeekHours=Round(ThisItem.WeekHours,0),"[$-en-US]0","[$-en-US]0.00"),"nl-NL"))
                  X: =0
                  Y: =0
                  Width: =Max(50,(scrWeeklyHours.Width-616)/Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0)))
                  Height: =44
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Size: =11
                  Color: =ColorValue("#000000")
                  Align: =Align.Center
        - lblReportWorkerTotal:
            Control: Label@2.5.1
            Properties:
              Text: =If(ThisItem.PeriodTotal=0,"–",Text(ThisItem.PeriodTotal,If(ThisItem.PeriodTotal=Round(ThisItem.PeriodTotal,0),"[$-en-US]0","[$-en-US]0.00"),"nl-NL"))
              X: =scrWeeklyHours.Width-216
              Y: =0
