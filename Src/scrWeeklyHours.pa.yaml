                      PressedFill: =ColorValue("#D5EDFF")
                      PressedBorderColor: =ColorValue("#0303B8")
                      FocusedBorderColor: =ColorValue("#0303B8")
                      HoverBorderColor: =ColorValue("#0303B8")
                      BorderColor: =ColorValue("#DCDCDC")
                      AllowEmptySelection: =true
                      BorderThickness: =1
                      ChevronBackground: =ColorValue("#F0F0F0")
                      ChevronFill: =ColorValue("#0303B8")
                      Color: =ColorValue("#000000")
                      Default: =Coalesce(LookUp(colReportProjects,ID=varReportProjectID,Title),ddProject.Selected.Value)
                      Fill: =ColorValue("#F0F0F0")
