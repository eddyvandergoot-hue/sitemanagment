        Control: Label@2.5.1
        Properties:
          Text: =""
          Visible: =false
          X: =0
          Y: =0
          Width: =256
          Height: =1
    - conSummarySelectors:
        Control: GroupContainer@1.5.0
        Variant: AutoLayout
        Properties:
