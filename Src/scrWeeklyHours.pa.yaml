          PaddingLeft: =8
          Visible: =varReportValid && !varReportBusy
    - galReportTotalWeeks:
        Control: Gallery@2.15.0
        Variant: Horizontal
        Properties:
          Items: =AddColumns(FirstN(Filter(colReportColumns,WeekIndex>=Min(Coalesce(varReportColumnOffset,1),Max(1,CountRows(colReportColumns)-Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0))+1))),Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0))) As week,WeekSum,Coalesce(Sum(Filter(colReportSelectedHours,Monday=week.Monday),HourValue),0))
          X: =440
          Y: =recReportTotalRow.Y+2
          Width: =Parent.Width-616
          Height: =42
          Fill: =Color.Transparent
          TemplateSize: =Max(50,(scrWeeklyHours.Width-616)/Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0)))
          TemplatePadding: =0
          ShowScrollbar: =false
          Visible: =varReportValid && !varReportBusy
        Children:
        - lblReportTotalWeekHours:
            Control: Label@2.5.1
            Properties:
              Text: =If(ThisItem.WeekSum=0,"–",Text(ThisItem.WeekSum,If(ThisItem.WeekSum=Round(ThisItem.WeekSum,0),"[$-en-US]0","[$-en-US]0.00"),"nl-NL"))
              X: =0
              Y: =0
              Width: =Max(50,(scrWeeklyHours.Width-616)/Max(1,RoundDown((scrWeeklyHours.Width-616)/90,0)))
              Height: =42
