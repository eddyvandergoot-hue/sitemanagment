              Height: =44
              Font: ="Inter, Arial, sans-serif"
              Size: =11
              Color: =ColorValue("#000F41")
              Fill: =Color.Transparent
              Align: =Align.Center
              VerticalAlign: =VerticalAlign.Middle
              FontWeight: =If(ThisItem.PeriodTotal=0,FontWeight.Normal,FontWeight.Bold)
