                                          NotificationType.Error,
                                          15000
                                      )
                                  )
                              ),
                              Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message}); Notify(
                                  "Opslagfout: " & FirstError.Message,
                                  NotificationType.Error,
                                  15000
                              )
                          );
                          
                          Trace("DIAG|SaveWeek|End",TraceSeverity.Information,{Scenario:"SaveWeek",Step:"End",ElapsedMs:DateDiff(varDiagSaveT0,Now(),TimeUnit.Milliseconds),Changes:CountRows(colHoursChanges),Reads:Coalesce(varDiagSaveReads,0),Writes:Coalesce(varDiagSaveWrites,0),PatchedRows:CountRows(colHoursPatchedExisting)+CountRows(colHoursPatchedNew),VerifiedRows:CountRows(colHoursWritten),Errors:CountRows(colHoursErrors)});
                          Set(varWeekSaving, false);
                          If(!IsEmpty(colHoursErrors) && Coalesce(varDiagSaveWrites,0)>0,Set(varWeekLoadState,"Failed" ); Set(varWeekReady,false); Notify("Opslag niet volledig bevestigd. Invoer behouden; controleer SharePoint-versies voordat u verdergaat.",NotificationType.Error,15000)),
                          Notify("Save week geblokkeerd: week niet volledig geladen, laadfout of selectie komt niet overeen.",NotificationType.Error,15000))
