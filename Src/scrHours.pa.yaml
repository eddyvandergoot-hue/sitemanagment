                                          IfError(CountRows(Collect(colSaveCheckRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,0,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,1,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                          IfError(CountRows(Collect(colSaveCheckRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,1,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,2,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                          IfError(CountRows(Collect(colSaveCheckRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,2,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,3,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                          IfError(CountRows(Collect(colSaveCheckRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,3,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,4,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                          IfError(CountRows(Collect(colSaveCheckRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,4,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,5,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                          IfError(CountRows(Collect(colSaveCheckRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,5,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,6,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
