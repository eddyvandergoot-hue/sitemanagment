                                                  If(
                                                      CountIf(colSaveVerify, EntryKey = w.KeyValue) <> 1 ||
                                                      IsBlank(verifiedRecord.HourID) ||
                                                      IsBlank(verifiedRecord.HourValue) ||
                                                      verifiedRecord.AssignmentID <> w.AssignmentID ||
                                                      verifiedRecord.WorkDay <> w.WorkDate ||
                                                      verifiedRecord.HourValue <> w.NewHours,
                                                      Collect(colHoursErrors,{WorkerName:w.WorkerName,KeyValue:w.KeyValue,Message:"De opgeslagen registratie kon niet correct worden teruggelezen."}),
                          
                                                      Collect(
                                                          colHoursWritten,
                                                          {
                                                              SavedID: verifiedRecord.HourID,
                                                              AssignmentID: w.AssignmentID,
                                                              WorkerName: w.WorkerName,
                                                              DayIndex: w.DayIndex,
                                                              KeyValue: w.KeyValue,
                                                              ExpectedHours: w.NewHours
