                                                      If(CountIf(newRows,TradeValue="Unknown")>0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:"Mogelijk ontbreekt Trade 'Unknown' in de Hours-lijst (MS-008)"}));
                                                      false);
                                                  If(CountRows(colHoursPatchedNew)<>CountRows(newRows) || CountIf(colHoursPatchedNew,IsBlank(ID))>0,
                                                      Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:"Opslaan leverde geen SharePoint-record-ID op."}))
                                              )
                                          )
                                      );
                          
                                      If(varDiagSaveWrites > 0,
                                          IfError(Refresh(Hours),Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                          Set(varDiagSaveReads,varDiagSaveReads+1);
                                          IfError(CountRows(ClearCollect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=varSaveQueryFrom && 'Work Date'<varSaveQueryUntil)))>=0,
                                              Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                          If(CountRows(colSaveVerifyRaw)>=500,
                                              Clear(colSaveVerifyRaw); Set(varDiagSaveReads,varDiagSaveReads+7);
                                              IfError(CountRows(Collect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,0,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,1,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                              IfError(CountRows(Collect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,1,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,2,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                              IfError(CountRows(Collect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,2,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,3,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                              IfError(CountRows(Collect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,3,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,4,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                              IfError(CountRows(Collect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,4,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,5,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                              IfError(CountRows(Collect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,5,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,6,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                              IfError(CountRows(Collect(colSaveVerifyRaw,Filter(Hours,StartsWith(EntryKey,varSaveQueryPrefix) && 'Work Date'>=DateAdd(varSaveQueryFrom,6,TimeUnit.Days) && 'Work Date'<DateAdd(varSaveQueryFrom,7,TimeUnit.Days))))>=0,Collect(colHoursErrors,{WorkerName:"",KeyValue:"",Message:FirstError.Message});false);
                                              true
                                          );
                                          ClearCollect(colSaveVerify,ForAll(colSaveVerifyRaw As entry,
                                              {HourID:entry.ID,AssignmentID:entry.Assignment.Id,WorkDay:Date(Year(entry.'Work Date'),Month(entry.'Work Date'),Day(entry.'Work Date')),EntryKey:entry.EntryKey,HourValue:entry.Hours}));
                          
                                          ForAll(
                                              colHoursWritePlan As w,
                                              With(
                                                  {
                                                      verifiedRecord: LookUp(colSaveVerify, EntryKey = w.KeyValue)
