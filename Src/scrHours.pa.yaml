                                                          2, UpdateIf(colWeekOriginal, ID = w.AssignmentID, {WedHours: verifiedRecord.HourValue}),
                                                          3, UpdateIf(colWeekOriginal, ID = w.AssignmentID, {ThuHours: verifiedRecord.HourValue}),
                                                          4, UpdateIf(colWeekOriginal, ID = w.AssignmentID, {FriHours: verifiedRecord.HourValue}),
                                                          5, UpdateIf(colWeekOriginal, ID = w.AssignmentID, {SatHours: verifiedRecord.HourValue}),
                                                          6, UpdateIf(colWeekOriginal, ID = w.AssignmentID, {SunHours: verifiedRecord.HourValue})
                                                      )
                                                  )
                                              )
                                          )
                                      );
                          
                                  If(
                                      IsEmpty(colHoursErrors) &&
                                      CountRows(colHoursWritten) = CountRows(colHoursChanges),
                                      Notify(
                                          "Werkweek opgeslagen en gecontroleerd. " &
                                          Text(CountRows(colHoursWritten)) &
                                          " dagregistratie(s).",
                                          NotificationType.Success
                                      ),

                                      !IsEmpty(colHoursErrors) && Coalesce(varDiagSaveWrites, 0) = 0,
                                      Notify(
                                          "Niet opgeslagen; er is niets naar SharePoint geschreven. " &
                                          If(IsBlank(First(colHoursErrors).WorkerName), "", First(colHoursErrors).WorkerName & ": ") &
                                          First(colHoursErrors).Message &
                                          If(CountRows(colHoursErrors) > 1, " (+" & Text(CountRows(colHoursErrors) - 1) & " meer)", ""),
                                          NotificationType.Error,
                                          15000
                                      ),

                                      Notify(
                                          "Niet alles kon worden opgeslagen en gecontroleerd. " &
                                          If(
                                              !IsEmpty(colHoursErrors),
                                              First(colHoursErrors).WorkerName & ": " &
                                              First(colHoursErrors).Message,
                                              "Het aantal opgeslagen registraties wijkt af."
