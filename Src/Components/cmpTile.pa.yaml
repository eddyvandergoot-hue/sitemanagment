ComponentDefinitions:
  cmpTile:
    DefinitionType: CanvasComponent
    Description: 'Home tile (ADMIN_PLAN.md par. 11, Eddy 30-10-2026, fixes TP-HOME-02 3-11-2026). Presentation only. Contract - the host passes the label, the icon image (white SVG variant for an active tile, grey variant for a Soon tile), the arrow image, the SOON word and the size inputs (the host sets the component Width and Height to the same square size; the arrow size follows the tile width 150/130/smaller). Active is fail-closed (false = Soon tile: grey, SOON word, no arrow, button disabled, OnSelect never raised). Layers bottom to top: background, icon, label, arrow, SOON word, click target. The click target (btnCmpTile) is transparent, covers the whole tile and is the top layer, so icon and arrow never take the hover; hover = semi-transparent Navy overlay over the whole tile (35 percent, pressed 50 percent), focus = 3 px #000F41 border. It raises cmpTile.OnSelect() only while Active is true; the host handler holds its own guard and navigation. Its text is the label in transparent colour (accessible name; the visible label is lblCmpTileLabel).'
    CustomProperties:
      Active:
        PropertyKind: Input
        DisplayName: Active
        Description: True = active tile (blue, arrow, raises OnSelect). False = Soon tile (grey, inert). Fail-closed default.
        DataType: Boolean
        Default: =false
      Arrow:
        PropertyKind: Input
        DisplayName: Arrow
        Description: Arrow image (white variant, icon-arrow.svg, aspect 28x20). Shown only while Active; 24x17 at tile 150, 20x14 at 130, 14x10 below.
        DataType: Image
        Default: =SampleImage
      Icon:
        PropertyKind: Input
        DisplayName: Icon
        Description: Tile icon (white variant for an active tile, grey variant for a Soon tile).
        DataType: Image
        Default: =SampleImage
      IconSize:
        PropertyKind: Input
        DisplayName: IconSize
        Description: Icon size in px (44 at tile 150, 38 at 130, 32 below).
        DataType: Number
        Default: =44
      Label:
        PropertyKind: Input
        DisplayName: Label
        Description: Tile label (bottom left, at most 2 lines).
        DataType: Text
        Default: =""
      LabelSize:
        PropertyKind: Input
        DisplayName: LabelSize
        Description: Label font size (Power Apps Size, points). 11 at tile 150, 10 at 130, 8 below; Measure-FontFit proves the longest active word (Contractors) fits next to the arrow.
        DataType: Number
        Default: =11
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: The active tile was selected (never raised while Active is false). No event parameters (AGENTS). The host handler holds the navigation and its guard.
        ReturnType: Boolean
        Default: =true
      Padding:
        PropertyKind: Input
        DisplayName: Padding
        Description: Inner padding in px (14 at tile 150, 12 at 130, 8 below).
        DataType: Number
        Default: =14
      SoonText:
        PropertyKind: Input
        DisplayName: SoonText
        Description: Word for the Soon corner (the component shows it in capitals). Texts come from the host translation table T.
        DataType: Text
        Default: ="Soon"
    Properties:
      Fill: =Color.Transparent
      Height: =150
      Width: =150
    Children:
      - recCmpTileBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(cmpTile.Active,ColorValue("#0303B8"),ColorValue("#E6E6E6"))
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
      - imgCmpTileIcon:
          Control: Image@2.2.3
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Fill: =Color.Transparent
            Height: =cmpTile.IconSize
            HoverFill: =Color.Transparent
            Image: =cmpTile.Icon
            ImagePosition: =ImagePosition.Fit
            PressedFill: =Color.Transparent
            TabIndex: =-1
            Width: =cmpTile.IconSize
            X: =cmpTile.Padding
            Y: =cmpTile.Padding
      - lblCmpTileLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =If(cmpTile.Active,Color.White,ColorValue("#6B6B6B"))
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Semibold
            Height: =Max(0,Parent.Height-Self.Y-cmpTile.Padding)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =cmpTile.LabelSize
            Text: =cmpTile.Label
            VerticalAlign: =VerticalAlign.Bottom
            Width: =Max(0,Parent.Width-2*cmpTile.Padding-If(cmpTile.Active,imgCmpTileArrow.Width+4,0))
            X: =cmpTile.Padding
            Y: =cmpTile.Padding+cmpTile.IconSize+6
      - imgCmpTileArrow:
          Control: Image@2.2.3
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Fill: =Color.Transparent
            Height: =If(cmpTile.Width>=150,17,cmpTile.Width>=130,14,10)
            HoverFill: =Color.Transparent
            Image: =cmpTile.Arrow
            ImagePosition: =ImagePosition.Fit
            PressedFill: =Color.Transparent
            TabIndex: =-1
            Visible: =cmpTile.Active
            Width: =If(cmpTile.Width>=150,24,cmpTile.Width>=130,20,14)
            X: =Parent.Width-cmpTile.Padding-Self.Width
            Y: =Parent.Height-cmpTile.Padding-Self.Height
      - lblCmpTileSoon:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorValue("#5A5A5A")
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Semibold
            Height: =16
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =If(cmpTile.Width>=130,11,9)
            Text: =Upper(cmpTile.SoonText)
            VerticalAlign: =VerticalAlign.Top
            Visible: =!cmpTile.Active
            Width: =Max(0,Parent.Width-cmpTile.Padding-cmpTile.Padding-cmpTile.IconSize-4)
            X: =Parent.Width-cmpTile.Padding-Self.Width
            Y: =cmpTile.Padding
      - btnCmpTile:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Color: =Color.Transparent
            DisabledBorderColor: =Color.Transparent
            DisabledColor: =Color.Transparent
            DisabledFill: =Color.Transparent
            DisplayMode: =If(cmpTile.Active,DisplayMode.Edit,DisplayMode.Disabled)
            Fill: =Color.Transparent
            FocusedBorderColor: =ColorValue("#000F41")
            FocusedBorderThickness: =3
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            HoverBorderColor: =Color.Transparent
            HoverColor: =Color.Transparent
            HoverFill: =ColorValue("#000F4159")
            OnSelect: =If(cmpTile.Active,cmpTile.OnSelect())
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Color.Transparent
            PressedColor: =Color.Transparent
            PressedFill: =ColorValue("#000F4180")
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =cmpTile.LabelSize
            Text: =cmpTile.Label
            Width: =Parent.Width
            X: =0
            Y: =0
