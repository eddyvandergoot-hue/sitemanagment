ComponentDefinitions:
  cmpField:
    DefinitionType: CanvasComponent
    Description: 'Admin screen form field (Admin screen pattern), built on the shape Eddy made and tested in Studio (Incoming 20261102Components, scrTest): input DefaultValue -> txtFieldValue.Default, output Value = txtFieldValue.Text (dropdown: ddFieldValue.Selected.Value, readonly: DefaultValue). Label with optional red star above one input (text, dropdown or readonly), total height 58 (label 20 + 1 + input 36 + 1; the input lies 1 px inside the component so the 2 px focus/invalid border is never clipped). Presentation only. Contract - the host passes the complete edit guard in Enabled and puts the SAME guard as the first condition in its OnChange handler. Reset contract - a changed DefaultValue updates the inner input (classic Default behaviour); after Discard the host calls Reset(<instance>), which runs OnReset and resets the inner input to DefaultValue. Dirty check and Save read the output Value, never the inner controls.'
    CustomProperties:
      DefaultValue:
        PropertyKind: Input
        DisplayName: DefaultValue
        Description: Value shown when loaded (loaded or saved value; never a draft). A dropdown DefaultValue that is not in Items is shown as an extra row (as-is) and Value returns it unchanged.
        DataType: Text
        Default: =""
      Enabled:
        PropertyKind: Input
        DisplayName: Enabled
        Description: Edit guard (true = Edit, false = Disabled). Fail-closed default. Read-only fields are always Disabled.
        DataType: Boolean
        Default: =false
      HintText:
        PropertyKind: Input
        DisplayName: HintText
        Description: Placeholder of the text field.
        DataType: Text
        Default: =""
      InputType:
        PropertyKind: Input
        DisplayName: InputType
        Description: 'text, dropdown or readonly. Any other value renders a disabled white text field (fail-closed).'
        DataType: Text
        Default: ="text"
      Invalid:
        PropertyKind: Input
        DisplayName: Invalid
        Description: True gives the field a 2 px red border (all states).
        DataType: Boolean
        Default: =false
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Dropdown choices, one column Value. Ignored for text and readonly. A DefaultValue outside this list is appended by the component as one extra row.
        DataType: Table
        Default: '=Filter(Table({Value: ""}),false)'
      Label:
        PropertyKind: Input
        DisplayName: Label
        Description: Field label (plain text, escaped by the component). Shown semibold 13 above the field, one line with ellipsis.
        DataType: Text
        Default: =""
      MaxLength:
        PropertyKind: Input
        DisplayName: MaxLength
        Description: Maximum number of characters of the text field.
        DataType: Number
        Default: =255
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        Description: The user changed the text or the choice. Only raised while Enabled is true. The host handler starts with its guard and compares Value with the saved value.
        ReturnType: Boolean
        Default: =true
      Required:
        PropertyKind: Input
        DisplayName: Required
        Description: Field is required (red star directly after the label text).
        DataType: Boolean
        Default: =false
      Value:
        PropertyKind: Output
        DisplayName: Value
        Description: Current field value (the typed text, the dropdown choice or, for readonly, DefaultValue), for the dirty check and Save. An explicit empty dropdown choice returns an empty string.
        DataType: Text
    Properties:
      Fill: =Color.Transparent
      Height: =58
      OnReset: =Reset(txtFieldValue); Reset(ddFieldValue)
      Value: =Switch(cmpField.InputType,"dropdown",Coalesce(ddFieldValue.Selected.Value,""),"readonly",cmpField.DefaultValue,txtFieldValue.Text)
      Width: =360
    Children:
      - htmlFieldLabel:
          Control: HtmlViewer@2.1.0
          Properties:
            AutoHeight: =false
            Color: =ColorValue("#000000")
            Fill: =Color.Transparent
            Font: ="Inter, Arial, sans-serif"
            Height: =20
            HtmlText: ="<style>html,body{margin:0;padding:0;overflow:hidden}</style><div style='margin:0;padding:0;overflow:hidden;display:flex;width:100%;font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:600;line-height:18px;color:#000000'><span style='min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>" & Substitute(Substitute(Substitute(Substitute(Substitute(cmpField.Label,"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</span>" & If(cmpField.Required,"<span style='color:#DB1E28'>&nbsp;*</span>","") & "</div>"
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Width: =Parent.Width-2
            X: =1
            Y: =0
      - txtFieldValue:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: =cmpField.Label
            Align: =Align.Left
            BorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),If(cmpField.InputType="readonly",Color.Transparent,ColorValue("#9B9B9B")))
            BorderThickness: =If(cmpField.Invalid,2,If(cmpField.InputType="readonly",0,1))
            Color: =ColorValue("#000000")
            Default: =cmpField.DefaultValue
            DisabledBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),If(cmpField.InputType="readonly",Color.Transparent,ColorValue("#9B9B9B")))
            DisabledColor: =ColorValue("#000000")
            DisabledFill: =If(cmpField.InputType="readonly",ColorValue("#F0F0F0"),Color.White)
            DisplayMode: =If(cmpField.Enabled && cmpField.InputType="text",DisplayMode.Edit,DisplayMode.Disabled)
            Fill: =Color.White
            FocusedBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#0303B8"))
            FocusedBorderThickness: =2
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
            Height: =36
            HintText: =cmpField.HintText
            HoverBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#5A5A5A"))
            HoverColor: =ColorValue("#000000")
            HoverFill: =Color.White
            MaxLength: =cmpField.MaxLength
            OnChange: =If(cmpField.Enabled,cmpField.OnChange())
            PaddingLeft: =12
            PaddingRight: =12
            PressedBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#0303B8"))
            PressedColor: =ColorValue("#000000")
            PressedFill: =Color.White
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =14
            Visible: =cmpField.InputType<>"dropdown"
            Width: =Parent.Width-2
            X: =1
            Y: =htmlFieldLabel.Y+htmlFieldLabel.Height+1
      - ddFieldValue:
          Control: Classic/DropDown@2.3.1
          Properties:
            AccessibleLabel: =cmpField.Label
            AllowEmptySelection: =true
            BorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#9B9B9B"))
            BorderThickness: =If(cmpField.Invalid,2,1)
            ChevronBackground: =Color.White
            ChevronFill: =ColorValue("#0303B8")
            ChevronHoverBackground: =ColorValue("#D5EDFF")
            ChevronHoverFill: =ColorValue("#0303B8")
            Color: =ColorValue("#000000")
            Default: =cmpField.DefaultValue
            DisabledBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#9B9B9B"))
            DisabledColor: =ColorValue("#000000")
            DisabledFill: =Color.White
            DisplayMode: =If(cmpField.Enabled && cmpField.InputType="dropdown",DisplayMode.Edit,DisplayMode.Disabled)
            Fill: =Color.White
            FocusedBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#0303B8"))
            FocusedBorderThickness: =2
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
            Height: =36
            HoverBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#5A5A5A"))
            HoverColor: =ColorValue("#000F41")
            HoverFill: =ColorValue("#D5EDFF")
            Items: '=If(IsBlank(cmpField.DefaultValue) || !IsBlank(LookUp(cmpField.Items,Value=cmpField.DefaultValue)),cmpField.Items,Ungroup(Table({t: ShowColumns(cmpField.Items,Value)},{t: Table({Value: cmpField.DefaultValue})}),t))'
            Items.Value: =Value
            OnChange: =If(cmpField.Enabled,cmpField.OnChange())
            PressedBorderColor: =If(cmpField.Invalid,ColorValue("#DB1E28"),ColorValue("#0303B8"))
            PressedColor: =ColorValue("#000F41")
            PressedFill: =ColorValue("#D5EDFF")
            SelectionColor: =Color.White
            SelectionFill: =ColorValue("#0303B8")
            Size: =14
            Visible: =cmpField.InputType="dropdown"
            Width: =Parent.Width-2
            X: =1
            Y: =htmlFieldLabel.Y+htmlFieldLabel.Height+1
