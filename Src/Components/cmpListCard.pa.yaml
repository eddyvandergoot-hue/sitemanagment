ComponentDefinitions:
  cmpListCard:
    DefinitionType: CanvasComponent
    Description: 'Admin screen list card (Admin screen pattern), built on the shape Eddy made and tested in Studio (Incoming 20261102Components, scrTest): SelectedRowID = galRows.Selected.ID, galRows.OnSelect = cmpListCard.OnSelectRow() (no parameters), filtering INSIDE the component (no instance output fed back into its own input). White card (radius 8, DropShadow.Light, padding 24) with search field, one info row (count left, Show inactive switch right) and a gallery of rows (height 64). The host passes all rows sorted; the component filters on Show inactive (column Inactive) and on its own search text (in Title or Subtitle, case-insensitive) and counts the shown rows. Selection contract - the host handles OnSelectRow with its guard as the first condition and reads the clicked row from Output SelectedRowID; the host passes its selection back in SelectedID; the row highlight shows the host selection (ThisItem.ID = SelectedID, what the form shows; none while SelectedID is 0), so a click the host guard blocks never moves the highlight; the row click target is disabled while Enabled is false. Switch contract - the host passes ShowInactive and handles OnToggleShowInactive by flipping its own variable (guard first); Output ShowInactiveValue echoes the state. The search text stays until the user clears it.'
    CustomProperties:
      CountFormat:
        PropertyKind: Input
        DisplayName: CountFormat
        Description: Count text with {0} for the number of shown rows (after Show inactive and search), for example {0} contractors (plain text, escaped by the component).
        DataType: Text
        Default: ="{0}"
      Enabled:
        PropertyKind: Input
        DisplayName: Enabled
        Description: Guard for search, row selection and the switch (true = Edit, false = Disabled). Fail-closed default.
        DataType: Boolean
        Default: =false
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: 'All rows, sorted by the host (not filtered). Columns ID (Number), Title (Text), Subtitle (Text), Inactive (Boolean: grey title, hidden unless ShowInactive), ChipText (Text, empty = no chip). Allowed ChipText values are Inactive, On hold and Closed (80 px chip, Inter 12, measured text at most 64 px); other texts need a new measurement.'
        DataType: Table
        Default: '=Table({ID: 0, Title: "", Subtitle: "", Inactive: false, ChipText: ""})'
      OffText:
        PropertyKind: Input
        DisplayName: OffText
        Description: Word for the switch state off, used in the tooltip.
        DataType: Text
        Default: ="Off"
      OnSelectRow:
        PropertyKind: Event
        DisplayName: OnSelectRow
        Description: A row was selected; the row ID is in Output SelectedRowID. No event parameters (AGENTS). The host handler starts with its guard.
        ReturnType: Boolean
        Default: =true
      OnText:
        PropertyKind: Input
        DisplayName: OnText
        Description: Word for the switch state on, used in the tooltip.
        DataType: Text
        Default: ="On"
      OnToggleShowInactive:
        PropertyKind: Event
        DisplayName: OnToggleShowInactive
        Description: The switch was pressed. Only raised while Enabled is true. The host handler starts with its guard and flips its own variable.
        ReturnType: Boolean
        Default: =true
      SearchHint:
        PropertyKind: Input
        DisplayName: SearchHint
        Description: Placeholder and accessible label of the search field.
        DataType: Text
        Default: =""
      SearchText:
        PropertyKind: Output
        DisplayName: SearchText
        Description: Current text of the search field. Read it only in behaviour formulas (for example the loader auto-select), never in an input of a cmpListCard instance (circular reference).
        DataType: Text
      SelectedID:
        PropertyKind: Input
        DisplayName: SelectedID
        Description: ID of the host selection (row highlight; 0 = no selection, no highlight; SharePoint IDs start at 1).
        DataType: Number
        Default: =0
      SelectedRowID:
        PropertyKind: Output
        DisplayName: SelectedRowID
        Description: ID of the selected gallery row (galRows.Selected.ID). Read it in the OnSelectRow handler.
        DataType: Number
      ShowInactive:
        PropertyKind: Input
        DisplayName: ShowInactive
        Description: Switch state (true = on, inactive rows shown).
        DataType: Boolean
        Default: =false
      ShowInactiveLabel:
        PropertyKind: Input
        DisplayName: ShowInactiveLabel
        Description: 'Label of the switch: Show inactive (Contractors, later Workers) or Show closed (Projects; Inactive = Status Closed, On hold always shown) (plain text, escaped by the component).'
        DataType: Text
        Default: =""
      ShowInactiveValue:
        PropertyKind: Output
        DisplayName: ShowInactiveValue
        Description: Echo of the ShowInactive input (the switch state the list is filtered with).
        DataType: Boolean
    Properties:
      Fill: =Color.Transparent
      Height: =600
      SearchText: =txtSearch.Text
      SelectedRowID: =galRows.Selected.ID
      ShowInactiveValue: =cmpListCard.ShowInactive
      Width: =360
    Children:
      - conCmpListCard:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =Color.White
            Height: =Parent.Height
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - txtSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: =cmpListCard.SearchHint
                  Align: =Align.Left
                  BorderColor: =ColorValue("#9B9B9B")
                  BorderThickness: =1
                  Color: =ColorValue("#000000")
                  Default: =""
                  DisabledBorderColor: =ColorValue("#9B9B9B")
                  DisabledColor: =ColorValue("#000000")
                  DisabledFill: =Color.White
                  DisplayMode: =If(cmpListCard.Enabled,DisplayMode.Edit,DisplayMode.Disabled)
                  Fill: =Color.White
                  FocusedBorderColor: =ColorValue("#0303B8")
                  FocusedBorderThickness: =2
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Height: =36
                  HintText: =cmpListCard.SearchHint
                  HoverBorderColor: =ColorValue("#5A5A5A")
                  HoverColor: =ColorValue("#000000")
                  HoverFill: =Color.White
                  MaxLength: =255
                  PaddingLeft: =40
                  PaddingRight: =12
                  PressedBorderColor: =ColorValue("#0303B8")
                  PressedColor: =ColorValue("#000000")
                  PressedFill: =Color.White
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Size: =14
                  Width: =Parent.Width-48
                  X: =24
                  Y: =24
            - icoCmpListSearch:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =""
                  Color: =ColorValue("#5A5A5A")
                  Height: =18
                  Icon: =Icon.Search
                  Width: =18
                  X: =txtSearch.X+12
                  Y: =txtSearch.Y+(txtSearch.Height-Self.Height)/2
            - htmlCmpListInfo:
                Control: HtmlViewer@2.1.0
                Properties:
                  AutoHeight: =false
                  Color: =ColorValue("#000000")
                  Fill: =Color.Transparent
                  Font: ="Inter, Arial, sans-serif"
                  Height: =26
                  HtmlText: ="<style>html,body{margin:0;padding:0;overflow:hidden}</style><div style='margin:0;padding:0;overflow:hidden;display:flex;width:100%;font-family:Inter,Arial,sans-serif;font-size:13px;line-height:24px;color:#000000'><span style='flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>" & Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(cmpListCard.CountFormat,"{0}",Text(CountRows(galRows.AllItems))),"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</span><span style='flex:none;white-space:nowrap;text-align:right;padding-left:8px'>" & Substitute(Substitute(Substitute(Substitute(Substitute(cmpListCard.ShowInactiveLabel,"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</span></div>"
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Width: =Max(0,btnCmpListSwitch.X-8-Self.X)
                  X: =24
                  Y: =txtSearch.Y+txtSearch.Height+12
            - btnCmpListSwitch:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =Color.Transparent
                  DisabledColor: =Color.White
                  DisabledFill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  DisplayMode: =If(cmpListCard.Enabled,DisplayMode.Edit,DisplayMode.Disabled)
                  Fill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Height: =24
                  HoverBorderColor: =Color.Transparent
                  HoverColor: =Color.White
                  HoverFill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  OnSelect: =If(cmpListCard.Enabled,cmpListCard.OnToggleShowInactive())
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PressedBorderColor: =Color.Transparent
                  PressedColor: =Color.White
                  PressedFill: =If(cmpListCard.ShowInactive,ColorValue("#0303B8"),ColorValue("#B4B4B4"))
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Size: =12
                  Text: =""
                  TabIndex: =-1
                  Tooltip: '=cmpListCard.ShowInactiveLabel & ": " & If(cmpListCard.ShowInactive,cmpListCard.OnText,cmpListCard.OffText)'
                  Width: =44
                  X: =Parent.Width-24-Self.Width
                  Y: =htmlCmpListInfo.Y+1
            - btnCmpListKnob:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =Color.Transparent
                  DisabledColor: =Color.White
                  DisabledFill: =Color.White
                  DisplayMode: =btnCmpListSwitch.DisplayMode
                  Fill: =Color.White
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Height: =18
                  HoverBorderColor: =Color.Transparent
                  HoverColor: =Color.White
                  HoverFill: =Color.White
                  OnSelect: =Select(btnCmpListSwitch)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PressedBorderColor: =Color.Transparent
                  PressedColor: =Color.White
                  PressedFill: =Color.White
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  Size: =12
                  Text: =""
                  TabIndex: =-1
                  Tooltip: =btnCmpListSwitch.Tooltip
                  Width: =18
                  X: =btnCmpListSwitch.X+If(cmpListCard.ShowInactive,btnCmpListSwitch.Width-Self.Width-3,3)
                  Y: =btnCmpListSwitch.Y+3
            - galRows:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  DisplayMode: =DisplayMode.Edit
                  Fill: =Color.White
                  Height: =Max(0,Parent.Height-Self.Y-12)
                  Items: =Filter(cmpListCard.Items,(cmpListCard.ShowInactive || !Inactive) && (IsBlank(Trim(txtSearch.Text)) || Trim(txtSearch.Text) in Title || Trim(txtSearch.Text) in Subtitle))
                  OnSelect: =cmpListCard.OnSelectRow()
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =0
                  TemplateSize: =64
                  Width: =Parent.Width
                  X: =0
                  Y: =htmlCmpListInfo.Y+htmlCmpListInfo.Height+12
                Children:
                  - recCmpRowFill:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =If(ThisItem.ID=cmpListCard.SelectedID,ColorValue("#D5EDFF"),Color.White)
                        Height: =Parent.TemplateHeight
                        HoverFill: =If(ThisItem.ID=cmpListCard.SelectedID,ColorValue("#D5EDFF"),If(cmpListCard.Enabled,ColorValue("#F0F0F0"),Color.White))
                        PressedFill: =If(ThisItem.ID=cmpListCard.SelectedID,ColorValue("#D5EDFF"),If(cmpListCard.Enabled,ColorValue("#F0F0F0"),Color.White))
                        TabIndex: =-1
                        Width: =Parent.TemplateWidth
                  - recCmpRowBar:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =ColorValue("#0303B8")
                        Height: =Parent.TemplateHeight
                        Visible: =ThisItem.ID=cmpListCard.SelectedID
                        TabIndex: =-1
                        Width: =3
                  - recCmpRowLine:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =ColorValue("#EDEDED")
                        Height: =1
                        TabIndex: =-1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight-1
                  - htmlCmpRowTitle:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =false
                        Color: =If(ThisItem.Inactive,ColorValue("#6B6B6B"),ColorValue("#000F41"))
                        Fill: =Color.Transparent
                        Font: ="Inter, Arial, sans-serif"
                        Height: =24
                        HtmlText: ="<style>html,body{margin:0;padding:0;overflow:hidden}</style><div style='margin:0;padding:0;overflow:hidden;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:600;line-height:22px;color:" & If(ThisItem.Inactive,"#6B6B6B","#000F41") & "'>" & Substitute(Substitute(Substitute(Substitute(Substitute(ThisItem.Title,"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =15
                        Tooltip: =ThisItem.Title
                        Width: =Max(0,Parent.TemplateWidth-Self.X-If(IsBlank(ThisItem.ChipText),16,16+btnCmpRowChip.Width+8))
                        X: =16
                        Y: =10
                  - htmlCmpRowSub:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =false
                        Color: =ColorValue("#5A5A5A")
                        Fill: =Color.Transparent
                        Font: ="Inter, Arial, sans-serif"
                        Height: =20
                        HtmlText: ="<style>html,body{margin:0;padding:0;overflow:hidden}</style><div style='margin:0;padding:0;overflow:hidden;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Inter,Arial,sans-serif;font-size:13px;line-height:18px;color:#5A5A5A'>" & Substitute(Substitute(Substitute(Substitute(Substitute(ThisItem.Subtitle,"&","&amp;"),"<","&lt;"),">","&gt;"),"""","&quot;"),"'","&#39;") & "</div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Tooltip: =ThisItem.Subtitle
                        Width: =Max(0,Parent.TemplateWidth-Self.X-16)
                        X: =16
                        Y: =34
                  - btnCmpRowChip:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Center
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =ColorValue("#000000")
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ColorValue("#000000")
                        DisabledFill: =ColorValue("#E6E6E6")
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =ColorValue("#E6E6E6")
                        Font: ="Inter, Arial, sans-serif"
                        FontWeight: =FontWeight.Normal
                        Height: =20
                        HoverBorderColor: =Color.Transparent
                        HoverColor: =ColorValue("#000000")
                        HoverFill: =ColorValue("#E6E6E6")
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Color.Transparent
                        PressedColor: =ColorValue("#000000")
                        PressedFill: =ColorValue("#E6E6E6")
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =12
                        Text: =ThisItem.ChipText
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =!IsBlank(ThisItem.ChipText)
                        Width: =80
                        X: =Parent.TemplateWidth-16-Self.Width
                        Y: =13
                  - btnCmpRowHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.Transparent
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =Color.Transparent
                        DisabledFill: =Color.Transparent
                        DisplayMode: =If(cmpListCard.Enabled,DisplayMode.Edit,DisplayMode.Disabled)
                        Fill: =Color.Transparent
                        Font: ="Inter, Arial, sans-serif"
                        FontWeight: =FontWeight.Normal
                        Height: =Parent.TemplateHeight
                        HoverBorderColor: =Color.Transparent
                        HoverColor: =Color.Transparent
                        HoverFill: =If(cmpListCard.Enabled && ThisItem.ID<>cmpListCard.SelectedID,ColorValue("#F0F0F099"),Color.Transparent)
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Color.Transparent
                        PressedColor: =Color.Transparent
                        PressedFill: =Color.Transparent
                        Size: =12
                        TabIndex: =-1
                        Text: =""
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
