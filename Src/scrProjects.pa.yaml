              =If(varPrjLoadState="Loaded" && IsEmpty(colPrjLoadErrors) && !Coalesce(varPrjBusy,false) && !Coalesce(varPrjSaving,false) && !Coalesce(varPrjSaveFailed,false),
               Reset(txtPrjName); Reset(txtPrjNumber); Reset(txtPrjReference); Reset(txtPrjCustomer); Reset(ddPrjStatus); Reset(txtPrjStreet); Reset(txtPrjHouseNumber); Reset(txtPrjPostalCode); Reset(txtPrjCity); Reset(ddPrjCountry); Reset(txtPrjUrl);
               Trace("DIAG|Projects|FormReset",TraceSeverity.Information,{Screen:"Projects",Mode:Coalesce(varPrjMode,"")}),
               Trace("DIAG|Projects|FormResetSkipped",TraceSeverity.Information,{Screen:"Projects",State:Coalesce(varPrjLoadState,"")})
              )
