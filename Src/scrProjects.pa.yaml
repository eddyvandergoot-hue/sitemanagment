Screens:
  scrProjects:
    Properties:
      Fill: =ColorValue("#F5F6F8")
      LoadingSpinnerColor: =ColorValue("#0303B8")
      OnVisible: |-
        =Set(varAdmMsgKind,""); Set(varAdmMsgHead,""); Set(varAdmMsgBody,"");
        If(IsBlank(varPrjLoadState),Set(varPrjLoadState,"NotLoaded"); Set(varPrjMode,""); Set(varPrjSelectedID,Blank()); Set(varPrjEdit,{ID:Blank(),Name:"",Number:"",Reference:"",Customer:"",Status:"",Street:"",HouseNumber:"",PostalCode:"",City:"",Country:"",Leader:"",SiteManager:"",Url:""}); Set(varPrjShowInactive,false); Set(varPrjSaveFailed,false));
        Trace("DIAG|Projects|OnVisible",TraceSeverity.Information,{Screen:"Projects",LoadState:Coalesce(varPrjLoadState,""),Mode:Coalesce(varPrjMode,"")});
        If(varPrjLoadState<>"Loaded" && !Coalesce(varPrjBusy,false) && !Coalesce(varPrjSaving,false) && !(Coalesce(varPrjMode,"") in ["New","Edit"] && (Trim(txtPrjName.Text & "")<>Trim(varPrjEdit.Name & "") || Trim(txtPrjNumber.Text & "")<>Trim(varPrjEdit.Number & "") || Trim(txtPrjReference.Text & "")<>Trim(varPrjEdit.Reference & "") || Trim(txtPrjCustomer.Text & "")<>Trim(varPrjEdit.Customer & "") || Trim(ddPrjStatus.Selected.Value & "")<>Trim(varPrjEdit.Status & "") || Trim(txtPrjStreet.Text & "")<>Trim(varPrjEdit.Street & "") || Trim(txtPrjHouseNumber.Text & "")<>Trim(varPrjEdit.HouseNumber & "") || Trim(txtPrjPostalCode.Text & "")<>Trim(varPrjEdit.PostalCode & "") || Trim(txtPrjCity.Text & "")<>Trim(varPrjEdit.City & "") || Trim(ddPrjCountry.Selected.Value & "")<>Trim(varPrjEdit.Country & "") || Trim(txtPrjUrl.Text & "")<>Trim(varPrjEdit.Url & ""))),Select(btnPrjLoad))
    Children:
      - lblPrjTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(LangNl && !IsBlank(T.prjTitle.nl),T.prjTitle.nl,T.prjTitle.en)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =60
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Semibold
            Size: =22
            Color: =Color.White
            PaddingLeft: =129
            Fill: =ColorValue("#0303B8")
      - imgLogoProjects:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="GEA"
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Height: =30
            Image: =GEA_logo_white
            ImagePosition: =ImagePosition.Fit
            Width: =99
            X: =lblPrjTitle.X+15
            Y: =lblPrjTitle.Y+(lblPrjTitle.Height-Self.Height)/2
      - imgPrjSpinner:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: =If(LangNl && !IsBlank(T.prjBusy.nl),T.prjBusy.nl,T.prjBusy.en)
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Height: =24
            Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24'><path d='M12 3 A9 9 0 1 1 3 12' fill='none' stroke='#FFFFFF' stroke-width='3' stroke-linecap='round'><animateTransform attributeName='transform' type='rotate' from='0 12 12' to='360 12 12' dur='0.9s' repeatCount='indefinite'/></path></svg>")
            ImagePosition: =ImagePosition.Fit
            Visible: =Coalesce(varPrjBusy,false) || Coalesce(varPrjSaving,false) || varPrjLoadState="Loading"
            Width: =24
            X: =lblPrjTitle.X+lblPrjTitle.Width-24-Self.Width
            Y: =lblPrjTitle.Y+(lblPrjTitle.Height-Self.Height)/2
      - conPrjMsgBar:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =lblPrjTitle.X
            Y: =lblPrjTitle.Y+lblPrjTitle.Height
            Width: =lblPrjTitle.Width
            Height: =If(!IsBlank(varAdmMsgKind),40,0)
            Visible: =!IsBlank(varAdmMsgKind)
            Fill: =Switch(varAdmMsgKind,"Error",ColorValue("#DB1E28"),"Warning",ColorValue("#F29400"),"Success",ColorValue("#1AFF80"),Color.Transparent)
            BorderThickness: =0
          Children:
            - lblPrjMsgHead:
                Control: Label@2.5.1
                Properties:
                  Color: =If(varAdmMsgKind="Error",Color.White,ColorValue("#000F41"))
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Bold
                  Height: =Parent.Height
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  Size: =14
                  Text: =varAdmMsgHead
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Len(varAdmMsgHead)*9+6
                  X: =24
                  Y: =0
            - lblPrjMsgBody:
                Control: Label@2.5.1
                Properties:
                  Color: =If(varAdmMsgKind="Error",Color.White,ColorValue("#000F41"))
                  Font: ="Inter, Arial, sans-serif"
                  FontWeight: =FontWeight.Normal
                  Height: =Parent.Height
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  Size: =14
                  Text: =varAdmMsgBody
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Max(0,Parent.Width-Self.X-56)
                  X: =lblPrjMsgHead.X+lblPrjMsgHead.Width+8
                  Y: =0
            - icoPrjMsgClose:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =If(LangNl && !IsBlank(T.admMsgClose.nl),T.admMsgClose.nl,T.admMsgClose.en)
                  Color: =If(varAdmMsgKind="Error",Color.White,ColorValue("#000F41"))
                  Height: =24
                  Icon: =Icon.Cancel
                  OnSelect: =Set(varAdmMsgKind,""); Set(varAdmMsgHead,""); Set(varAdmMsgBody,"")
                  Tooltip: =If(LangNl && !IsBlank(T.admMsgClose.nl),T.admMsgClose.nl,T.admMsgClose.en)
                  Width: =24
                  X: =Parent.Width-Self.Width-16
                  Y: =(Parent.Height-Self.Height)/2
      - lblPrjLayout:
          Control: Label@2.5.1
          Properties:
            Text: =""
            Visible: =false
            X: =If(Parent.Width>=1000,1,0)
            Y: =If(Self.X=1,408,24)
            Width: =If(Self.X=1,Max(0,Parent.Width-432),Parent.Width-48)
            Height: =If(Self.X=1,24,500)
