            Visible: =false
            X: =If(lblPrjLayout.Width-48>=572,3,If(lblPrjLayout.Width-48>=376,2,1))
            Y: =lblPrjModified.Y+lblPrjModified.Height+24
            Width: =If(lblPrjLayout.X=1,Self.Height-48,452)
            Height: =If(lblPrjLayout.X=1,Max(conPrjBody.Height,Self.Y+48,568),lblPrjLayout.Height+Self.Y+24)
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
      - lblPrjGrid:
          Control: Label@2.5.1
          Properties:
            Text: =""
            Visible: =false
            X: =lblPrjMetrics.X
            Y: =74
            Width: =(lblPrjLayout.Width-48-16*(lblPrjMetrics.X-1))/lblPrjMetrics.X
            Height: =36
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
      - btnPrjLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Load"
            Visible: =false
            DisplayMode: =DisplayMode.Edit
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Font: ="Inter, Arial, sans-serif"
            OnSelect: |-
              =If(Coalesce(varPrjBusy,false) || Coalesce(varPrjSaving,false),
               Trace("DIAG|Projects|LoadSkipped",TraceSeverity.Information,{Screen:"Projects",Reason:"Busy"}),
               If((Coalesce(varPrjMode,"") in ["New","Edit"] && (Trim(txtPrjName.Text & "")<>Trim(varPrjEdit.Name & "") || Trim(txtPrjNumber.Text & "")<>Trim(varPrjEdit.Number & "") || Trim(txtPrjReference.Text & "")<>Trim(varPrjEdit.Reference & "") || Trim(txtPrjCustomer.Text & "")<>Trim(varPrjEdit.Customer & "") || Trim(ddPrjStatus.Selected.Value & "")<>Trim(varPrjEdit.Status & "") || Trim(txtPrjStreet.Text & "")<>Trim(varPrjEdit.Street & "") || Trim(txtPrjHouseNumber.Text & "")<>Trim(varPrjEdit.HouseNumber & "") || Trim(txtPrjPostalCode.Text & "")<>Trim(varPrjEdit.PostalCode & "") || Trim(txtPrjCity.Text & "")<>Trim(varPrjEdit.City & "") || Trim(ddPrjCountry.Selected.Value & "")<>Trim(varPrjEdit.Country & "") || Trim(txtPrjUrl.Text & "")<>Trim(varPrjEdit.Url & ""))) && !Coalesce(varPrjSaveFailed,false),
                Set(varAdmMsgKind,"Error"); Set(varAdmMsgHead,If(LangNl && !IsBlank(T.admHeadBlocked.nl),T.admHeadBlocked.nl,T.admHeadBlocked.en)); Set(varAdmMsgBody,If(LangNl && !IsBlank(T.prjMsgReloadBlocked.nl),T.prjMsgReloadBlocked.nl,T.prjMsgReloadBlocked.en)),
                If(!Coalesce(varPrjForceRefresh,false) && varPrjLoadState="Loaded" && IsEmpty(colPrjLoadErrors) && !Coalesce(varPrjSaveFailed,false),
                 Trace("DIAG|Projects|CacheHit",TraceSeverity.Information,{Screen:"Projects",Rows:CountRows(colAdminProjects)}),
                 Set(varPrjBusy,true); Set(varPrjLoadState,"Loading"); Set(varPrjDiagT0,Now());
                 Clear(colPrjLoadErrors); Clear(colPendingPrjRaw); Clear(colPendingAdminProjects); Clear(colPendingPrjModified);
                 IfError(Refresh(Projects),Collect(colPrjLoadErrors,{Message:If(LangNl && !IsBlank(T.prjErrLoadProjects.nl),T.prjErrLoadProjects.nl,T.prjErrLoadProjects.en) & " " & FirstError.Message});false);
                 IfError(CountRows(ClearCollect(colPendingPrjRaw,Sort(Projects,Title,SortOrder.Ascending)))>=0,
                  Collect(colPrjLoadErrors,{Message:If(LangNl && !IsBlank(T.prjErrLoadProjects.nl),T.prjErrLoadProjects.nl,T.prjErrLoadProjects.en) & " " & FirstError.Message});false);
                 ClearCollect(colPendingAdminProjects,ForAll(colPendingPrjRaw As prj,{ID:prj.ID,Name:Trim(prj.Title & ""),Number:Trim(prj.'Project Number' & ""),Reference:Trim(prj.'Project Reference' & ""),Customer:Trim(prj.'Customer Name' & ""),Status:Trim(prj.Status.Value & ""),Street:Trim(prj.Street & ""),HouseNumber:Trim(prj.'House Number' & ""),PostalCode:Trim(prj.'Postal Code' & ""),City:Trim(prj.City & ""),Country:Trim(prj.Country.Value & ""),Leader:Trim(prj.'Project Leader'.DisplayName & ""),SiteManager:Trim(prj.'Site Managers'.DisplayName & ""),Url:Trim(prj.'ProjectHomeSite URL' & "")}));
                 ClearCollect(colPendingPrjModified,ForAll(colPendingPrjRaw As prj,{ID:prj.ID,Modified:prj.Modified}));
                 If(CountRows(colPendingPrjRaw)>=500,Collect(colPrjLoadErrors,{Message:If(LangNl && !IsBlank(T.prjErrLimitProjects.nl),T.prjErrLimitProjects.nl,T.prjErrLimitProjects.en)}));
                 If(IsEmpty(colPrjLoadErrors),
                  ClearCollect(colAdminProjects,colPendingAdminProjects); ClearCollect(colPrjModified,colPendingPrjModified);
                  If(varPrjMode="Edit" && !IsBlank(LookUp(colAdminProjects,ID=varPrjSelectedID).ID),
                   Set(varPrjEdit,LookUp(colAdminProjects,ID=varPrjSelectedID)),
                   varPrjMode="New" && !Coalesce(varPrjSaveFailed,false),
                   Set(varPrjEdit,{ID:Blank(),Name:"",Number:"",Reference:"",Customer:"",Status:"Active",Street:"",HouseNumber:"",PostalCode:"",City:"",Country:"Netherlands",Leader:"",SiteManager:"",Url:""}),
                   Set(varPrjMode,""); Set(varPrjSelectedID,Blank()); Set(varPrjEdit,{ID:Blank(),Name:"",Number:"",Reference:"",Customer:"",Status:"",Street:"",HouseNumber:"",PostalCode:"",City:"",Country:"",Leader:"",SiteManager:"",Url:""})
                  );
                  Set(varPrjSaveFailed,false); Clear(colPrjSaveErrors); Set(varPrjLoadState,"Loaded");
                  Reset(txtPrjName); Reset(txtPrjNumber); Reset(txtPrjReference); Reset(txtPrjCustomer); Reset(ddPrjStatus); Reset(txtPrjStreet); Reset(txtPrjHouseNumber); Reset(txtPrjPostalCode); Reset(txtPrjCity); Reset(ddPrjCountry); Reset(txtPrjUrl);
                  Set(varPrjLoadedAt,Now());
                  Set(varAdmMsgKind,"Success"); Set(varAdmMsgHead,If(LangNl && !IsBlank(T.admHeadLoaded.nl),T.admHeadLoaded.nl,T.admHeadLoaded.en)); Set(varAdmMsgBody,Substitute(Substitute(If(LangNl && !IsBlank(T.prjMsgLoaded.nl),T.prjMsgLoaded.nl,T.prjMsgLoaded.en),"{0}",Text(CountRows(colAdminProjects))),"{1}",Text(varPrjLoadedAt,"hh:mm:ss"))),
                  Set(varPrjLoadState,"Failed");
                  Set(varAdmMsgKind,"Error"); Set(varAdmMsgHead,If(LangNl && !IsBlank(T.admHeadNotLoaded.nl),T.admHeadNotLoaded.nl,T.admHeadNotLoaded.en)); Set(varAdmMsgBody,Substitute(If(LangNl && !IsBlank(T.prjMsgLoadFailed.nl),T.prjMsgLoadFailed.nl,T.prjMsgLoadFailed.en),"{0}",With({n:CountRows(colPrjLoadErrors)-1},First(colPrjLoadErrors).Message & If(n>0,Substitute(If(LangNl && !IsBlank(T.prjMsgMore.nl),T.prjMsgMore.nl,T.prjMsgMore.en),"{0}",Text(n)),""))))
                 );
                 Set(varPrjForceRefresh,false); Set(varPrjBusy,false);
                 Trace("DIAG|Projects|LoadEnd",TraceSeverity.Information,{Screen:"Projects",ElapsedMs:DateDiff(varPrjDiagT0,Now(),TimeUnit.Milliseconds),Rows:CountRows(colPendingAdminProjects),Errors:CountRows(colPrjLoadErrors),State:varPrjLoadState});
                 If(varPrjLoadState="Loaded",Select(btnPrjFormReset))
                )
               )
              )
      - btnPrjFormReset:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Reset"
            Visible: =false
            DisplayMode: =DisplayMode.Edit
            X: =0
            Y: =0
            Width: =1
            Height: =1
