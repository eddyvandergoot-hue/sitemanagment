                   Collect(colWrEmployersErrors,{Message:If(LangNl && !IsBlank(T.wrErrLoadEmployers.nl),T.wrErrLoadEmployers.nl,T.wrErrLoadEmployers.en) & " " & FirstError.Message});false),
