                If(CountRows(colWrPendEmployers)>=500,Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrLimitEmployers.nl),T.wrErrLimitEmployers.nl,T.wrErrLimitEmployers.en)}));
                If(CountRows(colWrPendWorkers)>=500,Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrLimitWorkers.nl),T.wrErrLimitWorkers.nl,T.wrErrLimitWorkers.en)}));
                If(IsEmpty(colWrLoadErrors),
                 ClearCollect(colWrProjects,ForAll(Sort(colWrPendProjects,Lower(Number & " " & Title),SortOrder.Ascending) As p,{ID:p.ID,Title:p.Title,Number:p.Number,Reference:p.Reference,Display:If(IsBlank(p.Number),p.Title & " (ID " & Text(p.ID) & ")",p.Number & " · " & p.Title)}));
                 ClearCollect(colWrEmployers,colWrPendEmployers); ClearCollect(colWrWorkers,colWrPendWorkers);
                 Set(varWrMastersReady,true)
                )
               );
               If(IsEmpty(colWrLoadErrors) && Coalesce(varWrMastersReady,false) && !IsBlank(varWrProjectID),
