                  IfError(CountRows(Collect(colWrPendHours,ForAll(Filter(Hours,StartsWith(EntryKey,varWrQueryPrefix) && 'Work Date'>=DateAdd(varWrMonday,1,TimeUnit.Days) && 'Work Date'<DateAdd(varWrMonday,2,TimeUnit.Days)) As entry,{HourID:entry.ID,EntryKey:Trim(entry.EntryKey & ""),AssignmentID:entry.Assignment.Id,WorkDay:Date(Year(entry.'Work Date'),Month(entry.'Work Date'),Day(entry.'Work Date')),ContractorID:entry.Employer.Id,ContractorName:Trim(entry.Employer.Value & ""),TradeRaw:Trim(entry.Trade.Value & ""),HourValue:entry.Hours})))>=0,Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrLoadHours.nl),T.wrErrLoadHours.nl,T.wrErrLoadHours.en) & " " & FirstError.Message});false);
