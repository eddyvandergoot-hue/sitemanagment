Screens:
  scrWeekReport:
    Properties:
      Fill: =ColorValue("#F5F6F8")
      LoadingSpinnerColor: =ColorValue("#0303B8")
      OnVisible: |-
        =Set(varAdmMsgKind,""); Set(varAdmMsgHead,""); Set(varAdmMsgBody,"");
        If(IsBlank(varWrLoadState),Set(varWrLoadState,"NotLoaded"); Set(varWrContractorDisplay,""); Set(varWrContractorID,0));
        If(IsBlank(varWrMonday),Set(varWrPickedDay,Today()); Set(varWrMonday,DateAdd(Today(),1-Weekday(Today(),StartOfWeek.Monday),TimeUnit.Days)));
        If(IsBlank(varWrProjectID) && !IsBlank(varProject.Id),Set(varWrProjectID,varProject.Id));
        Trace("DIAG|WeekReport|OnVisible",TraceSeverity.Information,{Screen:"WeekReport",LoadState:Coalesce(varWrLoadState,"")});
        If(!Coalesce(varWrBusy,false),Set(varWrMastersReady,false); Set(varWrForceRefresh,false); Select(btnWrLoad))
    Children:
      - cmpWrTitle:
          Control: CanvasComponent
          ComponentName: cmpTitleBar
          Properties:
            Busy: =Coalesce(varWrBusy,false) || varWrLoadState="Loading"
            BusyLabel: =If(LangNl && !IsBlank(T.wrBusy.nl),T.wrBusy.nl,T.wrBusy.en)
            Height: =60
            Logo: =GEA_logo_white
            Title: =If(LangNl && !IsBlank(T.wrTitle.nl),T.wrTitle.nl,T.wrTitle.en)
            Width: =Parent.Width
            X: =0
            Y: =0
      - cmpWrMsgBar:
          Control: CanvasComponent
          ComponentName: cmpMessageBar
          Properties:
            Body: =varAdmMsgBody
            CloseLabel: =If(LangNl && !IsBlank(T.admMsgClose.nl),T.admMsgClose.nl,T.admMsgClose.en)
            Head: =varAdmMsgHead
            Height: =If(IsBlank(varAdmMsgKind),0,40)
            Kind: =varAdmMsgKind
            OnClose: =Set(varAdmMsgKind,""); Set(varAdmMsgHead,""); Set(varAdmMsgBody,"")
            Width: =cmpWrTitle.Width
            X: =cmpWrTitle.X
            Y: =cmpWrTitle.Y+cmpWrTitle.Height
      - lblWrSel:
          Control: Label@2.5.1
          Properties:
            Text: =""
            Visible: =false
            X: =If(Parent.Width-112>=1148,1,0)
            Y: =If(Self.X=1,1,If(Parent.Width-112>=576,1,0))
            Width: =If(Self.X=1,360,If(Self.Y=1,Min(360,RoundDown((Parent.Width-112-16)/2,0)),Parent.Width-112))
            Height: =If(Self.X=1,106,If(Self.Y=1,180,254))
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
      - lblWrCols:
          Control: Label@2.5.1
          Properties:
            Text: =""
            Visible: =false
            X: =If(Parent.Width-112>=928,72,If(Parent.Width-112>=736,56,44))
            Y: =If(Parent.Width-112>=928,96,If(Parent.Width-112>=736,80,72))
            Width: =If(Parent.Width-112>=928,240,If(Parent.Width-112>=736,200,140))
            Height: =If(Parent.Width-112>=928,88,64)
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
      - lblWrMetrics:
          Control: Label@2.5.1
          Properties:
            Text: =""
            Visible: =false
            X: =0
            Y: =0
            Width: =If(galWrLines.Visible,136+galWrLines.Height+24,156)
            Height: =conWrTableCard.Y+conWrTableCard.Height+24
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
      - btnWrLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Load"
            Visible: =false
            DisplayMode: =DisplayMode.Edit
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Font: ="Inter, Arial, sans-serif"
            FontWeight: =FontWeight.Normal
            OnSelect: |-
              =If(Coalesce(varWrBusy,false),
               Trace("DIAG|WeekReport|LoadSkipped",TraceSeverity.Information,{Screen:"WeekReport",Reason:"Busy"}),
               Set(varWrBusy,true); Set(varWrLoadState,"Loading"); Set(varWrDiagT0,Now());
               Clear(colWrLoadErrors); Clear(colWrProjectsErrors); Clear(colWrEmployersErrors); Clear(colWrWorkersErrors);
               Clear(colWrPendPW); Clear(colWrPendPeriods); Clear(colWrPendHours); Clear(colWrPendFacts); Clear(colWrPendPeriodWorkers); Clear(colWrPendKeys); Clear(colWrPendRows); Clear(colWrPendRowsShown); Clear(colWrPendGroups); Clear(colWrPendGroupRank); Clear(colWrPendRowRank); Clear(colWrPendLines); Clear(colWrPendContractorItems);
               Set(varWrNextMonday,DateAdd(varWrMonday,7,TimeUnit.Days)); Set(varWrPendSunday,DateAdd(varWrMonday,6,TimeUnit.Days)); Set(varWrQueryPaged,false); Set(varWrPendIsTest,false); Set(varWrPendExcluded,0);
               Trace("DIAG|WeekReport|Start",TraceSeverity.Information,{Screen:"WeekReport",Monday:Coalesce(Text(varWrMonday,"yyyy-mm-dd"),""),ProjectID:Coalesce(varWrProjectID,0),Forced:Coalesce(varWrForceRefresh,false),MastersReady:Coalesce(varWrMastersReady,false)});
               If(IsBlank(varWrMonday),Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrNoWeek.nl),T.wrErrNoWeek.nl,T.wrErrNoWeek.en)}));
               If(IsEmpty(colWrLoadErrors) && (Coalesce(varWrForceRefresh,false) || !Coalesce(varWrMastersReady,false)),
                Set(varWrMastersReady,false); Clear(colWrPendProjects); Clear(colWrPendEmployers); Clear(colWrPendWorkers);
                IfError(Refresh(Projects),Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrLoadProjects.nl),T.wrErrLoadProjects.nl,T.wrErrLoadProjects.en) & " " & FirstError.Message});false);
                IfError(Refresh(Employers),Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrLoadEmployers.nl),T.wrErrLoadEmployers.nl,T.wrErrLoadEmployers.en) & " " & FirstError.Message});false);
                IfError(Refresh(Workers),Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrLoadWorkers.nl),T.wrErrLoadWorkers.nl,T.wrErrLoadWorkers.en) & " " & FirstError.Message});false);
                If(IsEmpty(colWrLoadErrors),
