                   Collect(colWrEmployersErrors,{Message:If(LangNl && !IsBlank(T.wrErrLoadEmployers.nl),T.wrErrLoadEmployers.nl,T.wrErrLoadEmployers.en) & " " & FirstError.Message});false),
                  IfError(CountRows(ClearCollect(colWrPendWorkers,ForAll(Workers As w,{ID:w.ID,FirstName:Trim(w.'First Name' & ""),Surname:Trim(w.Surname & ""),Code:Trim(w.'Worker Code' & ""),Trade:Trim(w.Trade.Value & ""),EmployerID:w.Employer.Id,EmployerName:Trim(w.Employer.Value & ""),Language:If(Trim(w.Language.Value & "")="Nederlands","Dutch",Trim(w.Language.Value & ""))})))>=0,
                   Collect(colWrWorkersErrors,{Message:If(LangNl && !IsBlank(T.wrErrLoadWorkers.nl),T.wrErrLoadWorkers.nl,T.wrErrLoadWorkers.en) & " " & FirstError.Message});false)
