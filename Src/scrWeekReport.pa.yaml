                 If(CountRows(colWrPendPeriods)>=500,Collect(colWrLoadErrors,{Message:If(LangNl && !IsBlank(T.wrErrLimitPeriods.nl),T.wrErrLimitPeriods.nl,T.wrErrLimitPeriods.en)}));
                 With({badRows:Filter(colWrPendPeriods,!IsBlank(AssignmentKey) && !StartsWith(AssignmentKey,varWrQueryPrefix))},If(!IsEmpty(badRows),Collect(colWrLoadErrors,{Message:Substitute(If(LangNl && !IsBlank(T.wrErrPeriodOtherProject.nl),T.wrErrPeriodOtherProject.nl,T.wrErrPeriodOtherProject.en),"{0}",Concat(FirstN(badRows,3),Text(ID),", "))})));
                 With({badRows:Filter(colWrPendPeriods,IsBlank(From) || IsBlank(AssignmentKey))},If(!IsEmpty(badRows),Collect(colWrLoadErrors,{Message:Substitute(If(LangNl && !IsBlank(T.wrErrPeriodData.nl),T.wrErrPeriodData.nl,T.wrErrPeriodData.en),"{0}",Concat(FirstN(badRows,3),Text(ID),", ") & If(CountRows(badRows)>3,Substitute(If(LangNl && !IsBlank(T.wrMsgMore.nl),T.wrMsgMore.nl,T.wrMsgMore.en),"{0}",Text(CountRows(badRows)-3)),""))})));
                 With({badRows:Filter(colWrPendPeriods As ap,!IsBlank(ap.AssignmentKey) && CountIf(colWrPendPW,varWrProjectKey & "|" & Text(WorkerID)=ap.AssignmentKey)=0)},If(!IsEmpty(badRows),Collect(colWrLoadErrors,{Message:Substitute(If(LangNl && !IsBlank(T.wrErrPeriodNoLink.nl),T.wrErrPeriodNoLink.nl,T.wrErrPeriodNoLink.en),"{0}",Concat(FirstN(badRows,3),AssignmentKey,", ") & If(CountRows(badRows)>3,Substitute(If(LangNl && !IsBlank(T.wrMsgMore.nl),T.wrMsgMore.nl,T.wrMsgMore.en),"{0}",Text(CountRows(badRows)-3)),""))})))
