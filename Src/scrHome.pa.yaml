          FontWeight: =FontWeight.Semibold
          Height: =56
          PaddingLeft: =129
          Size: =22
          Text: ="Site Management"
          Width: =Parent.Width-80
          X: =40
          Y: =24
    - imgLogoHome:
        Control: Image@2.2.3
        Properties:
          AccessibleLabel: ="GEA"
          BorderColor: =Color.Transparent
          BorderThickness: =0
          Height: =30
          Image: =GEA_logo_white
          ImagePosition: =ImagePosition.Fit
          Width: =99
          X: =lblHomeTitle.X+15
          Y: =lblHomeTitle.Y+(lblHomeTitle.Height-Self.Height)/2
    - lblHomeLayout:
        Control: Label@2.5.1
        Properties:
          Text: =""
          Visible: =false
          X: =If(conHomeScroll.Width-80>=648,3,1)
          Y: =If(Self.X=3,(conHomeScroll.Width-80-48)/3,conHomeScroll.Width-80)
          Width: =Max(1,RoundDown((Self.Y+12)/212,0))
          Height: =(Self.Y-(Self.Width-1)*12)/Self.Width
    - lblHomeRows:
        Control: Label@2.5.1
        Properties:
          Text: =""
          Visible: =false
          X: =RoundUp(7/lblHomeLayout.Width,0)
          Y: =RoundUp(4/lblHomeLayout.Width,0)
          Width: =RoundUp(4/lblHomeLayout.Width,0)
          Height: =0
    - lblHomeColumns:
        Control: Label@2.5.1
        Properties:
          Text: =""
          Visible: =false
          X: =0
          Y: =If(lblHomeLayout.X=3,0,34+122*lblHomeRows.X+24)
          Width: =If(lblHomeLayout.X=3,0,Self.Y+34+122*lblHomeRows.Y+24)
          Height: =If(lblHomeLayout.X=3,Max(34+122*lblHomeRows.X,34+122*lblHomeRows.Y,34+122*lblHomeRows.Width),Self.Width+34+122*lblHomeRows.Width)+24
