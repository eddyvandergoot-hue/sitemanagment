Screens:
  scrHome:
    Properties:
      Fill: =Color.White
      LoadingSpinnerColor: =ColorValue("#0303B8")
    Children:
      - cmpHomeTitle:
          Control: CanvasComponent
          ComponentName: cmpTitleBar
          Properties:
            Height: =60
            Logo: =GEA_logo_white
            Title: =If(LangNl && !IsBlank(T.homeTitle.nl),T.homeTitle.nl,T.homeTitle.en)
            Width: =Parent.Width
            X: =0
            Y: =0
      - lblHomeMetrics:
          Control: Label@2.5.1
          Properties:
            Height: =Max(1,RoundDown((Self.Y+10)/(Self.Width+10),0))
            Text: =""
            Visible: =false
            Width: =If(Parent.Width>=1000,150,If(Parent.Width>=700,130,Min(110,RoundDown((Self.Y-20)/3,0))))
            X: =If(Parent.Width<700,16,40)
            Y: =Parent.Width-2*Self.X-16
      - conHomeScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =Color.White
            Height: =Max(0,Parent.Height-Self.Y)
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =32
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutOverflowX: =LayoutOverflow.Hide
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutWrap: =false
            PaddingBottom: =32
            PaddingLeft: =lblHomeMetrics.X
            PaddingRight: =lblHomeMetrics.X
            PaddingTop: =32
            Width: =Parent.Width
            X: =0
            Y: =cmpHomeTitle.Height
