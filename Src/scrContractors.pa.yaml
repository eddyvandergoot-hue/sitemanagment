               If((Coalesce(varEmpMode,"") in ["New","Edit"] && (Trim(txtEmpName.Text & "")<>Trim(varEmpEdit.Name & "") || Trim(txtEmpAddress.Text & "")<>Trim(varEmpEdit.Address & "") || Trim(txtEmpPostalcode.Text & "")<>Trim(varEmpEdit.Postalcode & "") || Trim(txtEmpCity.Text & "")<>Trim(varEmpEdit.City & "") || Trim(txtEmpCountry.Text & "")<>Trim(varEmpEdit.Country & "") || Trim(txtEmpContactName.Text & "")<>Trim(varEmpEdit.ContactName & "") || Trim(txtEmpContactEmail.Text & "")<>Trim(varEmpEdit.ContactEmail & "") || Trim(txtEmpContactPhone.Text & "")<>Trim(varEmpEdit.ContactPhone & "") || Coalesce(chkEmpActive.Value,true)<>Coalesce(varEmpEdit.Active,true))) && !Coalesce(varEmpSaveFailed,false),
                Set(varEmpMsg,If(LangNl && !IsBlank(T.empMsgReloadBlocked.nl),T.empMsgReloadBlocked.nl,T.empMsgReloadBlocked.en)); Set(varEmpMsgError,true),
                If(!Coalesce(varEmpForceRefresh,false) && varEmpLoadState="Loaded" && IsEmpty(colEmpLoadErrors) && !Coalesce(varEmpSaveFailed,false),
                 Trace("DIAG|Contractors|CacheHit",TraceSeverity.Information,{Screen:"Contractors",Rows:CountRows(colAdminEmployers)}),
                 Set(varEmpBusy,true); Set(varEmpLoadState,"Loading"); Set(varEmpDiagT0,Now());
                 Set(varEmpMsg,If(LangNl && !IsBlank(T.empMsgLoading.nl),T.empMsgLoading.nl,T.empMsgLoading.en)); Set(varEmpMsgError,false);
                 Clear(colEmpLoadErrors); Clear(colEmpEmployersLoadErrors); Clear(colEmpWorkersLoadErrors); Clear(colPendingEmpRaw); Clear(colPendingAdminEmployers); Clear(colPendingEmpModified); Clear(colPendingEmpWorkers);
                 IfError(Refresh(Employers),Collect(colEmpLoadErrors,{Message:If(LangNl && !IsBlank(T.empErrLoadEmployers.nl),T.empErrLoadEmployers.nl,T.empErrLoadEmployers.en) & " " & FirstError.Message});false);
                 IfError(Refresh(Workers),Collect(colEmpLoadErrors,{Message:If(LangNl && !IsBlank(T.empErrLoadWorkers.nl),T.empErrLoadWorkers.nl,T.empErrLoadWorkers.en) & " " & FirstError.Message});false);
                 Concurrent(
                  IfError(CountRows(ClearCollect(colPendingEmpRaw,Sort(Employers,Title,SortOrder.Ascending)))>=0,
                   Collect(colEmpEmployersLoadErrors,{Message:If(LangNl && !IsBlank(T.empErrLoadEmployers.nl),T.empErrLoadEmployers.nl,T.empErrLoadEmployers.en) & " " & FirstError.Message});false),
                  IfError(CountRows(ClearCollect(colPendingEmpWorkers,ForAll(Workers As wrk,{ID:wrk.ID,EmployerID:wrk.Employer.Id,WorkerActive:wrk.Active})))>=0,
                   Collect(colEmpWorkersLoadErrors,{Message:If(LangNl && !IsBlank(T.empErrLoadWorkers.nl),T.empErrLoadWorkers.nl,T.empErrLoadWorkers.en) & " " & FirstError.Message});false)
                 );
                 ClearCollect(colPendingAdminEmployers,ForAll(colPendingEmpRaw As emp,{ID:emp.ID,Name:Trim(emp.Title & ""),Code:Trim(emp.'Employer Code' & ""),Address:Trim(emp.Address & ""),Postalcode:Trim(emp.Postalcode & ""),City:Trim(emp.City & ""),Country:Trim(emp.Country & ""),ContactName:Trim(emp.'Contact Name' & ""),ContactEmail:Trim(emp.'Contact Email' & ""),ContactPhone:Trim(emp.'Contact Phone' & ""),Active:Coalesce(emp.Active,true)}));
                 ClearCollect(colPendingEmpModified,ForAll(colPendingEmpRaw As emp,{ID:emp.ID,Modified:emp.Modified}));
                 Collect(colEmpLoadErrors,colEmpEmployersLoadErrors,colEmpWorkersLoadErrors);
                 If(CountRows(colPendingEmpRaw)>=500,Collect(colEmpLoadErrors,{Message:If(LangNl && !IsBlank(T.empErrLimitEmployers.nl),T.empErrLimitEmployers.nl,T.empErrLimitEmployers.en)}));
                 If(CountRows(colPendingEmpWorkers)>=500,Collect(colEmpLoadErrors,{Message:If(LangNl && !IsBlank(T.empErrLimitWorkers.nl),T.empErrLimitWorkers.nl,T.empErrLimitWorkers.en)}));
                 If(IsEmpty(colEmpLoadErrors),
                  ClearCollect(colAdminEmployers,colPendingAdminEmployers); ClearCollect(colEmpWorkers,colPendingEmpWorkers); ClearCollect(colEmpModified,colPendingEmpModified);
                  If(varEmpMode="Edit" && !IsBlank(LookUp(colAdminEmployers,ID=varEmpSelectedID).ID),
                   Set(varEmpEdit,LookUp(colAdminEmployers,ID=varEmpSelectedID)),
                   varEmpMode="New" && !Coalesce(varEmpSaveFailed,false),
                   Set(varEmpEdit,{ID:Blank(),Name:"",Code:"",Address:"",Postalcode:"",City:"",Country:"",ContactName:"",ContactEmail:"",ContactPhone:"",Active:true}),
                   Set(varEmpMode,""); Set(varEmpSelectedID,Blank()); Set(varEmpEdit,{ID:Blank(),Name:"",Code:"",Address:"",Postalcode:"",City:"",Country:"",ContactName:"",ContactEmail:"",ContactPhone:"",Active:true})
                  );
                  Set(varEmpSaveFailed,false); Clear(colEmpSaveErrors); Set(varEmpLoadState,"Loaded");
                  Reset(txtEmpName); Reset(txtEmpAddress); Reset(txtEmpPostalcode); Reset(txtEmpCity); Reset(txtEmpCountry); Reset(txtEmpContactName); Reset(txtEmpContactEmail); Reset(txtEmpContactPhone); Reset(chkEmpActive);
                  Set(varEmpLoadedAt,Now());
                  Set(varEmpMsg,Substitute(Substitute(If(LangNl && !IsBlank(T.empMsgLoaded.nl),T.empMsgLoaded.nl,T.empMsgLoaded.en),"{0}",Text(CountRows(colAdminEmployers))),"{1}",Text(varEmpLoadedAt,"hh:mm:ss"))); Set(varEmpMsgError,false),
